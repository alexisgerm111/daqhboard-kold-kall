<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kold Kall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

/* ═══════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════ */
:root {
  --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-body:    'Inter', system-ui, sans-serif;

  /* light */
  --l-bg:       #F5F3EE;
  --l-surface:  #FFFFFF;
  --l-surf2:    #EFECE6;
  --l-surf3:    #E4E0D7;
  --l-border:   #DDD9CF;
  --l-accent:   #6D28D9;
  --l-accentL:  #7C3AED;
  --l-accentBg: #F0EBFF;
  --l-t1:       #1A1322;
  --l-t2:       #3D3550;
  --l-t3:       #7B7290;
  --l-t4:       #ADA8BC;
  --l-green:    #059669; --l-greenBg: #ECFDF5;
  --l-amber:    #B45309; --l-amberBg: #FFFBEB;
  --l-red:      #DC2626; --l-redBg:   #FEF2F2;

  /* dark */
  --d-bg:       #0D0B14;
  --d-surface:  #141128;
  --d-surf2:    #1D1A32;
  --d-surf3:    #252242;
  --d-border:   #2E2A4A;
  --d-accent:   #A78BFA;
  --d-accentL:  #C4B5FD;
  --d-accentBg: rgba(167,139,250,.12);
  --d-t1:       #F0EEFF;
  --d-t2:       #B8B2D4;
  --d-t3:       #736D92;
  --d-t4:       #3E3960;
  --d-green:    #34D399; --d-greenBg: rgba(52,211,153,.1);
  --d-amber:    #FCD34D; --d-amberBg: rgba(252,211,77,.1);
  --d-red:      #F87171; --d-redBg:   rgba(248,113,113,.1);

  --ease: cubic-bezier(.4,0,.2,1);
}

[data-theme="light"] {
  --bg:       var(--l-bg);
  --surface:  var(--l-surface);
  --surf2:    var(--l-surf2);
  --surf3:    var(--l-surf3);
  --border:   var(--l-border);
  --accent:   var(--l-accent);
  --accentL:  var(--l-accentL);
  --accentBg: var(--l-accentBg);
  --t1: var(--l-t1); --t2: var(--l-t2); --t3: var(--l-t3); --t4: var(--l-t4);
  --green: var(--l-green); --greenBg: var(--l-greenBg);
  --amber: var(--l-amber); --amberBg: var(--l-amberBg);
  --red:   var(--l-red);   --redBg:   var(--l-redBg);
}
[data-theme="dark"] {
  --bg:       var(--d-bg);
  --surface:  var(--d-surface);
  --surf2:    var(--d-surf2);
  --surf3:    var(--d-surf3);
  --border:   var(--d-border);
  --accent:   var(--d-accent);
  --accentL:  var(--d-accentL);
  --accentBg: var(--d-accentBg);
  --t1: var(--d-t1); --t2: var(--d-t2); --t3: var(--d-t3); --t4: var(--d-t4);
  --green: var(--d-green); --greenBg: var(--d-greenBg);
  --amber: var(--d-amber); --amberBg: var(--d-amberBg);
  --red:   var(--d-red);   --redBg:   var(--d-redBg);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--t1);
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  transition:background .25s var(--ease),color .25s var(--ease);
  overflow:hidden;
}
button,input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

#login-screen{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
  z-index:9999;
}
.login-wrap{
  width:min(380px,92vw);
  display:flex;flex-direction:column;gap:0;
}
.login-eyebrow{
  font-family:var(--font-display);
  font-size:11px;font-weight:600;
  letter-spacing:.12em;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:10px;
}
.login-headline{
  font-family:var(--font-display);
  font-size:32px;font-weight:800;
  line-height:1.1;letter-spacing:-.5px;
  color:var(--t1);
  margin-bottom:6px;
}
.login-sub{
  font-size:13px;color:var(--t3);
  line-height:1.6;margin-bottom:32px;
}
.login-form{display:flex;flex-direction:column;gap:14px;}
.f-label{
  display:block;font-size:11px;font-weight:600;
  color:var(--t3);margin-bottom:5px;letter-spacing:.02em;
}
.f-input{
  width:100%;padding:11px 14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--t1);font-size:14px;
  outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.f-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accentBg);
}
.f-input::placeholder{color:var(--t4);}
.login-err{
  font-size:12px;color:var(--red);
  background:var(--redBg);
  padding:8px 12px;border-radius:6px;
  display:none;
}
.btn-main{
  width:100%;padding:13px 20px;
  background:var(--accent);color:#fff;
  border:none;border-radius:8px;
  font-family:var(--font-display);
  font-size:14px;font-weight:700;
  cursor:pointer;letter-spacing:-.1px;
  transition:opacity .15s,transform .1s;
}
.btn-main:hover{opacity:.92;}
.btn-main:active{transform:scale(.98);}
.btn-main:disabled{opacity:.45;cursor:wait;}
.login-theme{
  position:absolute;top:20px;right:20px;
}

.theme-pill{
  display:inline-flex;align-items:center;gap:2px;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:99px;padding:3px;
  cursor:pointer;
}
.theme-opt{
  width:28px;height:28px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;transition:background .15s,color .15s;
  color:var(--t3);background:transparent;border:none;cursor:pointer;
}
.theme-opt.on{background:var(--surface);color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.15);}

#app{
  display:none;
  height:100dvh;
  flex-direction:column;
  overflow:hidden;
}

.nav{
  height:52px;flex-shrink:0;
  display:flex;align-items:center;
  padding:0 24px;
  gap:0;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  position:relative;
  z-index:50;
}
.nav-logo{
  font-family:var(--font-display);
  font-size:15px;font-weight:800;
  letter-spacing:-.3px;color:var(--t1);
  display:flex;align-items:center;gap:8px;
  margin-right:32px;flex-shrink:0;
}
.logo-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 8px var(--accent);
}
.nav-tabs{
  display:flex;gap:0;flex:1;
}
.nav-tab{
  padding:0 16px;height:52px;
  display:flex;align-items:center;
  font-size:13px;font-weight:500;
  color:var(--t3);
  border:none;background:transparent;
  cursor:pointer;position:relative;
  transition:color .15s;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.nav-tab:hover{color:var(--t1);}
.nav-tab.active{
  color:var(--t1);font-weight:600;
  border-bottom-color:var(--accent);
}
.nav-right{
  margin-left:auto;
  display:flex;align-items:center;gap:10px;
}
.user-pill{
  display:flex;align-items:center;gap:8px;
  padding:5px 10px 5px 5px;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:99px;cursor:pointer;
  transition:background .15s;
}
.user-pill:hover{background:var(--surf3);}
.user-avatar{
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accentL));
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;
  flex-shrink:0;
}
.user-name-pill{font-size:12px;font-weight:500;color:var(--t2);}

.btn-launch{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 18px;
  background:var(--accent);color:#fff;
  border:none;border-radius:8px;
  font-family:var(--font-display);
  font-size:13px;font-weight:700;
  cursor:pointer;
  transition:opacity .15s,transform .1s;
  white-space:nowrap;flex-shrink:0;
}
.btn-launch:hover{opacity:.9;}
.btn-launch:active{transform:scale(.98);}
.btn-launch:disabled{opacity:.45;cursor:wait;}
.btn-launch svg{width:14px;height:14px;}

.main-content{
  flex:1;overflow-y:auto;
  padding:32px 32px 40px;
  display:flex;flex-direction:column;
  gap:24px;
}

.hero-empty{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;gap:16px;
  padding:60px 20px;
}
.hero-icon{
  width:64px;height:64px;border-radius:16px;
  background:var(--accentBg);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:4px;
}
.hero-icon svg{width:32px;height:32px;color:var(--accent);}
.hero-title{
  font-family:var(--font-display);
  font-size:24px;font-weight:800;
  letter-spacing:-.4px;color:var(--t1);
}
.hero-sub{font-size:14px;color:var(--t3);line-height:1.6;max-width:380px;}

.journal-header{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;
}
.journal-title{
  font-family:var(--font-display);
  font-size:20px;font-weight:800;
  letter-spacing:-.4px;color:var(--t1);
}
.journal-count{
  font-size:12px;color:var(--t3);
  background:var(--surf2);
  border:1px solid var(--border);
  padding:3px 10px;border-radius:99px;
}
.journal{
  display:flex;flex-direction:column;
  gap:2px;
}

.session-row{
  display:grid;
  grid-template-columns: 4px 1fr auto auto auto;
  align-items:center;
  gap:0 20px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px 20px 16px 0;
  cursor:pointer;
  transition:border-color .15s, transform .12s, box-shadow .15s;
  overflow:hidden;
  position:relative;
}
.session-row:hover{
  border-color:var(--accent);
  transform:translateX(2px);
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}
.session-stripe{
  position:absolute;left:0;top:0;bottom:0;width:4px;
  border-radius:10px 0 0 10px;
  transition:opacity .15s;
}
.session-stripe.high{background:var(--green);}
.session-stripe.medium{background:var(--amber);}
.session-stripe.low{background:var(--red);}
.session-stripe.none{background:var(--border);}

.session-info{padding-left:20px;}
.session-name{
  font-family:var(--font-display);
  font-size:14px;font-weight:700;
  color:var(--t1);letter-spacing:-.1px;
  margin-bottom:4px;
}
.session-date{font-size:12px;color:var(--t3);}
.session-status{
  font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:99px;
  white-space:nowrap;
}
.session-status.terminee{background:var(--greenBg);color:var(--green);}
.session-status.en_cours{background:var(--amberBg);color:var(--amber);}
.session-status.preparation{background:var(--surf2);color:var(--t3);border:1px solid var(--border);}
.session-status.erreur_preparation{background:var(--redBg);color:var(--red);}
.session-status.abandonnee{background:var(--surf3);color:var(--t3);}

.session-dur{
  font-size:13px;color:var(--t3);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.session-score{
  font-family:var(--font-display);
  font-size:18px;font-weight:800;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  min-width:60px;text-align:right;
}
.session-score.high{color:var(--green);}
.session-score.medium{color:var(--amber);}
.session-score.low{color:var(--red);}
.session-score.none{color:var(--t4);font-size:13px;font-weight:500;}

.ranking-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:12px;
}
.rank-entry{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:20px;
  display:flex;align-items:center;
  gap:14px;
  transition:border-color .15s,transform .12s;
}
.rank-entry:hover{border-color:var(--accent);transform:translateY(-2px);}
.rank-number{
  font-family:var(--font-display);
  font-size:28px;font-weight:800;
  letter-spacing:-.5px;
  min-width:36px;text-align:center;
  line-height:1;
}
.rank-number.r1{color:var(--amber);}
.rank-number.r2{color:var(--t3);}
.rank-number.r3{color:var(--amber);opacity:.6;}
.rank-number.rN{color:var(--t4);font-size:20px;}
.rank-name{font-size:14px;font-weight:600;color:var(--t1);}
.rank-avg{font-size:12px;color:var(--t3);margin-top:2px;font-variant-numeric:tabular-nums;}

.drawer-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.5);
  z-index:100;
  opacity:0;pointer-events:none;
  transition:opacity .25s var(--ease);
  backdrop-filter:blur(2px);
}
.drawer-overlay.open{opacity:1;pointer-events:all;}
.drawer{
  position:fixed;right:0;top:0;bottom:0;
  width:min(520px,100vw);
  background:var(--surface);
  border-left:1px solid var(--border);
  z-index:101;
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .3s var(--ease);
  overflow:hidden;
}
.drawer-overlay.open .drawer{transform:translateX(0);}
.drawer-head{
  padding:20px 24px 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.drawer-title{
  font-family:var(--font-display);
  font-size:16px;font-weight:800;
  letter-spacing:-.3px;color:var(--t1);
}
.drawer-close{
  width:32px;height:32px;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--t3);font-size:18px;
  transition:background .15s,color .15s;border:none;
}
.drawer-close:hover{background:var(--surf3);color:var(--t1);}
.drawer-progress{
  height:3px;background:var(--surf3);flex-shrink:0;
}
.drawer-bar{
  height:100%;background:var(--accent);
  transition:width .35s var(--ease);
  border-radius:0 99px 99px 0;
}
.drawer-body{
  flex:1;overflow-y:auto;
  padding:24px;
}
.drawer-foot{
  padding:16px 24px;
  border-top:1px solid var(--border);
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;
  flex-shrink:0;
  background:var(--surface);
}
.drawer-step-label{
  font-size:11px;color:var(--t3);font-weight:500;
}

.step-title{
  font-family:var(--font-display);
  font-size:18px;font-weight:800;
  letter-spacing:-.3px;color:var(--t1);
  margin-bottom:6px;
}
.step-sub{
  font-size:13px;color:var(--t3);
  line-height:1.65;margin-bottom:24px;
}
.pick-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-bottom:20px;
}
.pick-card{
  border:1.5px solid var(--border);
  border-radius:10px;padding:16px;
  background:var(--surf2);
  cursor:pointer;text-align:left;
  transition:border-color .15s,background .15s,transform .1s;
}
.pick-card:hover{border-color:var(--accent);background:var(--surface);}
.pick-card.sel{
  border-color:var(--accent);
  background:var(--accentBg);
}
.pick-card:active{transform:scale(.98);}
.pick-label{
  font-family:var(--font-display);
  font-size:14px;font-weight:700;color:var(--t1);
  margin-bottom:4px;
}
.pick-desc{font-size:11px;color:var(--t3);line-height:1.5;}

.section-sep{
  font-size:11px;font-weight:600;color:var(--t3);
  letter-spacing:.05em;
  margin:20px 0 10px;
  display:flex;align-items:center;gap:10px;
}
.section-sep::after{content:'';flex:1;height:1px;background:var(--border);}

.field-block{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.d-label{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.02em;}
.d-input{
  width:100%;padding:9px 12px;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:8px;color:var(--t1);font-size:13px;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.d-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg);}
.d-input::placeholder{color:var(--t4);}
.d-select{
  width:100%;padding:9px 12px;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:8px;color:var(--t1);font-size:13px;
  outline:none;transition:border-color .15s,box-shadow .15s;
  appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%237B7290' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;
  padding-right:32px;
}
.d-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg);}
.d-textarea{
  width:100%;min-height:90px;resize:vertical;
  padding:9px 12px;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:8px;color:var(--t1);font-size:13px;
  outline:none;transition:border-color .15s,box-shadow .15s;
  line-height:1.6;
}
.d-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg);}
.d-textarea::placeholder{color:var(--t4);}

.url-pair{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;}
.btn-analyze{
  padding:9px 14px;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:8px;color:var(--t2);
  font-size:12px;font-weight:600;
  cursor:pointer;white-space:nowrap;
  transition:border-color .15s,color .15s,background .15s;
}
.btn-analyze:hover{border-color:var(--accent);color:var(--accent);}
.btn-analyze:disabled{opacity:.45;cursor:wait;}
.analyze-result{
  display:none;margin-top:7px;padding:8px 12px;
  background:var(--accentBg);border:1px solid rgba(167,139,250,.2);
  border-radius:7px;font-size:12px;color:var(--accent);
  line-height:1.5;
}
.analyze-result.show{display:block;}

.w-error{
  display:none;margin-top:14px;
  padding:9px 12px;
  background:var(--redBg);border:1px solid rgba(248,113,113,.2);
  border-radius:7px;font-size:12px;color:var(--red);
}
.w-error.show{display:block;}

.prev-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;}
.prev-item{
  border:1.5px solid var(--border);border-radius:8px;
  background:var(--surf2);padding:10px 12px;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.prev-item:hover{border-color:var(--accent);}
.prev-item.sel{border-color:var(--accent);background:var(--accentBg);}
.prev-item-name{font-size:13px;font-weight:600;color:var(--t1);}
.prev-item-meta{font-size:11px;color:var(--t3);margin-top:2px;}
.prev-item-compat{font-size:10px;font-weight:600;margin-top:4px;}
.compat-ok{color:var(--green);}
.compat-warn{color:var(--amber);}

.cont-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.cont-card{
  border:1.5px solid var(--border);border-radius:8px;
  background:var(--surf2);padding:12px;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.cont-card:hover{border-color:var(--accent);}
