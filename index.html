<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kold Kall — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── TOKENS ─────────────────────────────────────────────────── */
:root {
  /* Light */
  --bg:        #EEF1F7;
  --surface:   #FFFFFF;
  --surface-2: #F4F6FA;
  --surface-3: #E8ECF4;
  --border:    #DDE2EE;
  --border-2:  #C8D0E2;

  --accent:    #0057FF;
  --accent-h:  #0044CC;
  --accent-2:  #00AAFF;
  --accent-glow: rgba(0,87,255,.12);

  --green:      #059669; --green-bg:  #ECFDF5;
  --amber:      #D97706; --amber-bg:  #FFFBEB;
  --red:        #DC2626; --red-bg:    #FEF2F2;
  --purple:     #6D28D9; --purple-bg: #F5F3FF;

  --text-1:  #0A0E1A;
  --text-2:  #2E3650;
  --text-3:  #5A6480;
  --text-4:  #8D97B0;

  --sidebar-w: 56px;
  --radius:    10px;
  --radius-sm: 6px;
  --shadow:    0 1px 3px rgba(10,14,26,.06), 0 1px 2px rgba(10,14,26,.04);
  --shadow-md: 0 4px 16px rgba(10,14,26,.09), 0 2px 4px rgba(10,14,26,.04);
  --shadow-lg: 0 12px 40px rgba(10,14,26,.13), 0 4px 8px rgba(10,14,26,.06);

  --transition: 150ms cubic-bezier(.4,0,.2,1);
}

[data-theme="dark"] {
  --bg:        #080C17;
  --surface:   #111827;
  --surface-2: #182035;
  --surface-3: #1E2840;
  --border:    #252E48;
  --border-2:  #2E3A58;

  --accent:    #3B82F6;
  --accent-h:  #60A5FA;
  --accent-2:  #38BDF8;
  --accent-glow: rgba(59,130,246,.15);

  --green:      #34D399; --green-bg:  rgba(52,211,153,.1);
  --amber:      #FBBF24; --amber-bg:  rgba(251,191,36,.1);
  --red:        #F87171; --red-bg:    rgba(248,113,113,.1);
  --purple:     #A78BFA; --purple-bg: rgba(167,139,250,.1);

  --text-1:  #EDF0F7;
  --text-2:  #B8C2D8;
  --text-3:  #7A87A3;
  --text-4:  #4A5568;

  --shadow:    0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.2);
  --shadow-md: 0 4px 16px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.2);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.5), 0 4px 8px rgba(0,0,0,.3);
}

/* ── RESET ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 13px; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text-1);
  display: flex;
  height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background var(--transition), color var(--transition);
}

/* ── LOGIN ──────────────────────────────────────────────────── */
.login-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  padding: 36px 32px;
  width: 100%; max-width: 360px;
  display: flex; flex-direction: column; gap: 18px;
}
.login-brand {
  display: flex; align-items: center; gap: 10px;
  justify-content: center; margin-bottom: 4px;
}
.login-logo {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.login-logo svg { width: 18px; height: 18px; color: #fff; }
.login-name { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
.login-sub { font-size: 12px; color: var(--text-3); text-align: center; margin-top: -10px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: .04em; }
.field-input {
  padding: 9px 12px;
  border: 1px solid var(--border-2);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text-1);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.field-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.field-input::placeholder { color: var(--text-4); }
.btn-primary {
  padding: 10px 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: background var(--transition), transform var(--transition);
  width: 100%;
}
.btn-primary:hover { background: var(--accent-h); }
.btn-primary:active { transform: scale(.98); }
.btn-primary:disabled { opacity: .55; cursor: wait; }
.error-msg { color: var(--red); font-size: 12px; text-align: center; display: none; }

/* ── SIDEBAR ────────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 0 16px;
  position: fixed; top: 0; left: 0; bottom: 0;
  z-index: 100;
  gap: 2px;
  transition: background var(--transition), border-color var(--transition);
}
.sb-logo {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px; flex-shrink: 0;
}
.sb-logo svg { width: 17px; height: 17px; color: #fff; }
.sb-btn {
  position: relative;
  width: 36px; height: 36px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-3);
  background: transparent;
  border: none;
  transition: background var(--transition), color var(--transition);
}
.sb-btn:hover { background: var(--surface-2); color: var(--text-1); }
.sb-btn.active { background: var(--accent-glow); color: var(--accent); }
.sb-btn svg { width: 18px; height: 18px; }
.sb-btn::after {
  content: attr(data-tip);
  position: absolute; left: calc(100% + 10px);
  background: var(--text-1); color: var(--bg);
  font-size: 11px; font-weight: 600;
  padding: 4px 8px; border-radius: 5px;
  white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity var(--transition);
  z-index: 200;
}
.sb-btn:hover::after { opacity: 1; }
.sb-sep { width: 28px; height: 1px; background: var(--border); margin: 6px 0; flex-shrink: 0; }
.sb-spacer { flex: 1; }
.sb-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  cursor: pointer; flex-shrink: 0;
}

/* ── MAIN ───────────────────────────────────────────────────── */
.main {
  margin-left: var(--sidebar-w);
  flex: 1; display: flex; flex-direction: column;
  min-width: 0; height: 100dvh;
  overflow: hidden;
}
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 48px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
  transition: background var(--transition), border-color var(--transition);
}
.topbar-left { display: flex; align-items: center; gap: 8px; }
.topbar-title { font-size: 13px; font-weight: 600; color: var(--text-1); }
.topbar-sub {
  font-size: 12px; color: var(--text-3);
  padding: 2px 8px;
  background: var(--surface-2);
  border-radius: 99px;
  border: 1px solid var(--border);
}
.topbar-right { display: flex; align-items: center; gap: 8px; }
.btn-launch {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  background: var(--accent);
  color: #fff;
  border: none; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: background var(--transition), transform var(--transition);
}
.btn-launch:hover { background: var(--accent-h); }
.btn-launch:active { transform: scale(.98); }
.btn-launch:disabled { opacity: .55; cursor: wait; }
.btn-launch svg { width: 13px; height: 13px; }
.btn-ghost {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 12px;
  background: transparent;
  border: 1px solid var(--border-2);
  color: var(--text-2);
  border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: background var(--transition), border-color var(--transition);
}
.btn-ghost:hover { background: var(--surface-2); border-color: var(--accent); color: var(--text-1); }
.theme-btn {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-2);
  transition: background var(--transition), color var(--transition);
}
.theme-btn:hover { background: var(--surface-3); color: var(--text-1); }
.theme-btn svg { width: 15px; height: 15px; }

/* ── CONTENT ─────────────────────────────────────────────────── */
.content {
  flex: 1; overflow-y: auto;
  padding: 20px;
  display: flex; flex-direction: column; gap: 14px;
}
.content::-webkit-scrollbar { width: 5px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; }

/* ── SECTION HEADER ─────────────────────────────────────────── */
.section-head { display: flex; align-items: center; justify-content: space-between; }
.section-title { font-size: 14px; font-weight: 700; color: var(--text-1); letter-spacing: -.2px; }
.section-count {
  font-size: 11px; color: var(--text-3);
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 2px 8px; border-radius: 99px;
}

/* ── SIM LIST ────────────────────────────────────────────────── */
.sim-list { display: flex; flex-direction: column; gap: 1px; }
.sim-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center; gap: 16px;
  cursor: pointer;
  transition: box-shadow var(--transition), border-color var(--transition), transform var(--transition);
  position: relative;
  overflow: hidden;
}
.sim-row::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent);
  opacity: 0;
  transition: opacity var(--transition);
}
.sim-row:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
.sim-row:hover::before { opacity: 1; }
.sim-row + .sim-row { margin-top: 6px; }
.sim-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sim-name { font-size: 13px; font-weight: 600; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sim-meta { display: flex; align-items: center; gap: 8px; }
.sim-date { font-size: 11px; color: var(--text-3); }
.sim-status {
  font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 99px;
  text-transform: capitalize;
}
.sim-status.terminee { background: var(--green-bg); color: var(--green); }
.sim-status.en_cours { background: var(--amber-bg); color: var(--amber); }
.sim-status.preparation { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); }
.sim-status.erreur_preparation { background: var(--red-bg); color: var(--red); }
.sim-dur { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sim-score {
  font-size: 14px; font-weight: 700;
  padding: 3px 10px; border-radius: 6px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.sim-score.high { background: var(--green-bg); color: var(--green); }
.sim-score.medium { background: var(--amber-bg); color: var(--amber); }
.sim-score.low { background: var(--red-bg); color: var(--red); }
.sim-score.none { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); font-size: 11px; }

/* ── RANKING ────────────────────────────────────────────────── */
.rank-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 10px; }
.rank-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  transition: box-shadow var(--transition);
}
.rank-card:hover { box-shadow: var(--shadow-md); }
.rank-pos {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0;
}
.rank-pos.p1 { background: rgba(251,191,36,.15); color: #D97706; }
.rank-pos.p2 { background: rgba(148,163,184,.15); color: #64748B; }
.rank-pos.p3 { background: rgba(180,120,60,.12); color: #92400E; }
.rank-pos.pN { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); }
.rank-name { font-size: 13px; font-weight: 600; }
.rank-score { font-size: 11px; color: var(--text-3); margin-top: 2px; font-variant-numeric: tabular-nums; }

/* ── EMPTY STATE ────────────────────────────────────────────── */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 48px 20px;
  color: var(--text-3); text-align: center;
}
.empty-state svg { width: 36px; height: 36px; opacity: .4; }
.empty-state p { font-size: 13px; }
.empty-state span { font-size: 12px; color: var(--text-4); }

/* ── MODAL ──────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  display: flex; align-items: flex-start; justify-content: center;
  z-index: 200;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
  padding: 20px;
  overflow-y: auto;
}
.modal-overlay.active { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  width: 900px; max-width: 100%;
  min-height: min-content;
  padding: 0;
  display: flex; flex-direction: column;
  gap: 0;
  margin: auto;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-title { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
.modal-close {
  width: 28px; height: 28px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-3);
  font-size: 16px; line-height: 1;
  transition: background var(--transition), color var(--transition);
}
.modal-close:hover { background: var(--red-bg); color: var(--red); border-color: var(--red); }
.modal-body {
  padding: 20px 22px;
  display: flex; flex-direction: column; gap: 16px;
  overflow-y: auto; max-height: 80vh;
}
.modal-body::-webkit-scrollbar { width: 5px; }
.modal-body::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; }

/* ── DEBRIEF ─────────────────────────────────────────────────── */
.debrief-header {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
}
.debrief-tagline { font-size: 18px; font-weight: 800; line-height: 1.3; letter-spacing: -.3px; max-width: 560px; }
.debrief-meta { font-size: 12px; color: var(--text-3); margin-top: 5px; }
.debrief-score {
  font-size: 36px; font-weight: 800; white-space: nowrap;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.debrief-score.high { color: var(--green); }
.debrief-score.medium { color: var(--amber); }
.debrief-score.low { color: var(--red); }
.debrief-score.none { color: var(--text-3); }

.section-label {
  font-size: 10px; font-weight: 700; letter-spacing: .08em;
  color: var(--text-4); text-transform: uppercase; margin-bottom: 10px;
}

.radar-wrap {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px;
}
.radar-svg { width: 220px; height: 220px; display: block; margin: 0 auto; }
.radar-legend { display: flex; gap: 14px; justify-content: center; font-size: 11px; color: var(--text-3); margin-top: 8px; }
.radar-legend span { display: flex; align-items: center; gap: 5px; }
.rdot { width: 16px; height: 0; border-top: 2px solid var(--accent); display: inline-block; }
.rdot.dashed { border-top-style: dashed; border-top-color: var(--purple); }

.metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.metric-card {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px;
}
.metric-label { font-size: 11px; color: var(--text-3); }
.metric-value {
  font-size: 22px; font-weight: 700; margin-top: 3px;
  font-variant-numeric: tabular-nums; color: var(--text-1);
}
.metric-help { font-size: 10px; color: var(--text-4); margin-top: 2px; }

.accordion {
  border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden;
}
.accordion + .accordion { margin-top: 6px; }
.accordion summary {
  cursor: pointer; padding: 11px 14px;
  font-size: 13px; font-weight: 600;
  background: var(--surface-2);
  list-style: none; display: flex; align-items: center; justify-content: space-between;
  transition: background var(--transition);
}
.accordion summary:hover { background: var(--surface-3); }
.accordion summary::-webkit-details-marker { display: none; }
.accordion summary::after {
  content: '+'; font-size: 16px; color: var(--text-3); font-weight: 400;
}
details[open] > summary::after { content: '−'; }
.accordion-body { padding: 12px 14px; }

.qual-list { display: flex; flex-direction: column; gap: 8px; }
.qual-item {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
}
.qual-chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.chip {
  font-size: 10px; font-weight: 600; padding: 2px 7px;
  border-radius: 99px;
}
.chip-time { background: rgba(0,87,255,.1); color: var(--accent); }
.chip-conf { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); }
.chip-fw { background: var(--purple-bg); color: var(--purple); }
.chip-adapt { background: var(--green-bg); color: var(--green); }
.chip-inst { background: var(--amber-bg); color: var(--amber); }
.chip-mank { background: var(--red-bg); color: var(--red); }
.qual-text { font-size: 12px; line-height: 1.6; color: var(--text-2); }
.qual-note { font-size: 10px; color: var(--text-4); margin-top: 5px; }

.dist-row { display: grid; grid-template-columns: 100px 1fr 40px; gap: 8px; align-items: center; margin-bottom: 7px; }
.dist-row:last-child { margin-bottom: 0; }
.dist-label { font-size: 11px; color: var(--text-2); text-transform: capitalize; }
.dist-bar { height: 6px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.dist-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; }
.dist-pct { font-size: 11px; color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums; }

.analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.analysis-cell {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px;
}
.analysis-cell strong { display: block; font-size: 10px; font-weight: 700; color: var(--text-4); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
.analysis-cell div { font-size: 12px; line-height: 1.6; color: var(--text-2); }

.bilan-gen {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
}
.bilan-gen-left { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.bilan-gen-title { font-size: 12px; font-weight: 700; }
.bilan-gen-help { font-size: 11px; color: var(--text-3); }
.sensitivity-row { display: flex; align-items: center; gap: 8px; }
.sensitivity-row input[type=range] { flex: 1; accent-color: var(--accent); }

.transcript-box { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.transcript-head { padding: 9px 14px; background: var(--surface-2); font-size: 11px; font-weight: 600; color: var(--text-3); border-bottom: 1px solid var(--border); }
.transcript-list { max-height: 340px; overflow-y: auto; }
.transcript-list::-webkit-scrollbar { width: 4px; }
.transcript-list::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; }
.t-line {

}
.t-line:last-child { border-bottom: none; }
.t-line:hover { background: var(--surface-2); }
.t-line.active { background: rgba(0,87,255,.06); box-shadow: inset 3px 0 0 var(--accent); }

.t-time { color: var(--text-4); font-size: 10px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.t-speaker { font-weight: 600; color: var(--text-3); font-size: 11px; }

/* ── MOMENT BTN ─────────────────────────────────────────────── */
.moment-btn {

  transition: background var(--transition);
}
.moment-btn:hover { background: var(--accent-glow); }

/* ── WIZARD STEPPER ─────────────────────────────────────────── */
.wizard { width: min(760px, 100%); }
.wizard-steps {

.w-step {

}
.w-step.active {

}
.w-step.done { background: var(--green-bg); border-color: var(--green); color: var(--green); }

.w-title { font-size: 16px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 5px; }

.choice-card {
  border: 1px solid var(--border-2);

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.btn-analyze {

}

.analysis-banner {

.w-actions {

.btn-secondary {

.w-kicker { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--text-4); text-transform: uppercase; margin: 14px 0 8px; }
.field-select {

<script>
const SUPABASE_URL = 'https://vjvyzbojcbwmfudkamlh.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_H-wuFrWTNgDEP0fwSWnqNg_c8dJMQZM';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const SIMULATION_APP_URL = 'https://agent-vocal-39hz.onrender.com';

let currentUser = null, currentProfile = null, currentView = 'simulations', latestAutoOpenedId = null;

const wizardState = {
  step:1, sessionId:null, b2b_b2c:null,
  vendeur_type_entreprise:'', vendeur_produit:'', vendeur_url:'',
  prospect_role:'', prospect_type_entreprise:'', prospect_url:'', prospect_profile:'',
  type_entretien:null, phase_choisie:null,
  simulation_precedente_id:null, continuite_rdv:null,
  continuationMode:'new', previousSimulations:[]
};

const $ = id => document.getElementById(id);

function escapeHtml(v) {
  return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function formatDate(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})+' à '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function formatDuration(s) { const n=Math.max(0,Number(s)||0); return `${Math.floor(n/60)}m${Math.floor(n%60).toString().padStart(2,'0')}s`; }
function fmtSec(s) { const n=Math.max(0,Number(s)||0); return `${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`; }
function getNoteClass(n) { const s=Number(n)||0; return s>10?(s>=70?'high':s>=50?'medium':'low'):(s>=7?'high':s>=5?'medium':'low'); }
function getInitials(nom,prenom) { return (prenom?.[0]||'')+(nom?.[0]||''); }
function getSimLabel(sim) {
  if(sim.type_entretien==='cold_call') return 'Cold Call';
  return ({complet:'Entretien complet',decouverte:'Découverte',demo:'Démo',objections_closing:'Objections & Closing',nego:'Négociation'}[sim.phase_choisie]||sim.type_scenario||'Rendez-vous');
}
function formatMetric(v,suf='') { const n=Number(v); return Number.isFinite(n)?`${Math.round(n)}${suf}`:'—'; }

// ── THEME ────────────────────────────────────────────────────
const savedTheme = localStorage.getItem('kk-theme')||'light';
document.documentElement.dataset.theme = savedTheme;
function updateThemeIcon(t) {
  $('iconSun').style.display  = t==='dark'  ? 'block' : 'none';
  $('iconMoon').style.display = t==='light' ? 'block' : 'none';
}
updateThemeIcon(savedTheme);
$('themeBtn').addEventListener('click',()=>{
  const next = document.documentElement.dataset.theme==='light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('kk-theme', next);
  updateThemeIcon(next);
});

// ── SUPABASE API ─────────────────────────────────────────────
async function getAccessToken() { const {data}=await supabaseClient.auth.getSession(); return data?.session?.access_token||null; }
async function simulationApi(path,options={}) {
  const token=await getAccessToken();
  const headers={...(options.body?{'Content-Type':'application/json'}:{}), ...(token?{Authorization:`Bearer ${token}`}:{}), ...(options.headers||{})};
  return fetch(`${SIMULATION_APP_URL}${path}`,{...options,headers});
}

// ── AUTH ─────────────────────────────────────────────────────
function showLogin(show) {
  $('loginScreen').style.display=show?'flex':'none';
  $('sidebar').style.display=show?'none':'flex';
  $('mainApp').style.display=show?'none':'flex';
}
function showError(msg) { const el=$('errorMsg'); el.style.display=msg?'block':'none'; el.textContent=msg||''; }

async function handleLogin() {
  showError('');
  const email=$('emailInput').value.trim(), password=$('passwordInput').value;
  if(!email||!password){showError('Veuillez remplir tous les champs.');return;}
  const btn=$('loginBtn'); btn.disabled=true; btn.textContent='Connexion…';
  try {
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error) throw error;
    currentUser=data.user;
    await loadProfile();
  } catch(err) { showError(err.message||'Erreur de connexion'); }
  finally { btn.disabled=false; btn.textContent='Se connecter'; }
}

async function loadProfile() {
  const {data:profile,error}=await supabaseClient.from('profiles').select('*').eq('id',currentUser.id).single();
  if(error||!profile){ showError('Profil introuvable.'); await supabaseClient.auth.signOut(); currentUser=null; showLogin(true); return; }
  currentProfile=profile; showLogin(false); updateSidebar(); await loadView('simulations');
}

function updateSidebar() {
  $('sidebarAvatar').textContent=getInitials(currentProfile?.nom,currentProfile?.prenom)||'?';
  $('teamName').textContent=currentProfile?.role==='directeur'?'Vue Directeur':'Vue Commercial';
  $('topbarSub').textContent=currentProfile?.role==='directeur'?'Directeur':'Commercial';
}

async function handleLogout() { await supabaseClient.auth.signOut(); currentUser=null; currentProfile=null; showLogin(true); }

// ── NAV ──────────────────────────────────────────────────────
document.querySelectorAll('.sb-btn[data-view]').forEach(btn=>btn.addEventListener('click',()=>{
  currentView=btn.dataset.view;
  document.querySelectorAll('.sb-btn[data-view]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadView(currentView);
}));
async function loadView(view) {
  const c=$('mainContent');
  if(view==='simulations') await loadSimulationsView(c);
  else if(view==='ranking') await loadRankingView(c);
}

// ── SIMULATIONS ──────────────────────────────────────────────
async function loadSimulationsView(container, autoOpen=true) {
  container.innerHTML='<div class="empty-state"><p>Chargement…</p></div>';
  let q=supabaseClient.from('simulations').select('id,user_id,created_at,duree_secondes,type_scenario,statut,type_entretien,phase_choisie,b2b_b2c,simulation_precedente_id,continuite_rdv,bilans(note_globale),profiles(nom,prenom)').order('created_at',{ascending:false});
  if(currentProfile?.role==='commercial') q=q.eq('user_id',currentUser.id);
  const {data:sims,error}=await q;
  if(error){container.innerHTML=`<div class="empty-state"><p>Erreur : ${escapeHtml(error.message)}</p></div>`;return;}
  if(!sims?.length){
    container.innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><p>Aucune simulation pour le moment.</p><span>Lance ta première simulation depuis le bouton en haut à droite.</span></div>`;
    return;
  }
  let html=`<div class="section-head"><div class="section-title">Simulations</div><span class="section-count">${sims.length}</span></div><div class="sim-list" style="margin-top:12px">`;
  sims.forEach(sim=>{
    const note=sim.bilans?.[0]?.note_globale;
    const nc=note!=null?getNoteClass(note):'none';
    const nd=note!=null?(Number(note)>10?`${note}/100`:`${note}/10`):'—';
    const userLabel=currentProfile?.role==='directeur'?` <span style="color:var(--text-3);font-weight:400">— ${escapeHtml(sim.profiles?.prenom||'')} ${escapeHtml(sim.profiles?.nom||'')}</span>`:'';
    html+=`<div class="sim-row" data-simid="${escapeHtml(sim.id)}">
      <div class="sim-main">
        <div class="sim-name">${escapeHtml(getSimLabel(sim))}${userLabel}</div>
        <div class="sim-meta">
          <span class="sim-date">${formatDate(sim.created_at)}</span>
          <span class="sim-status ${sim.statut||''}">${escapeHtml(sim.statut||'—')}</span>
        </div>
      </div>
      <span class="sim-dur">${formatDuration(sim.duree_secondes||0)}</span>
      <span class="sim-score ${nc}">${escapeHtml(nd)}</span>
    </div>`;
  });
  html+='</div>';
  container.innerHTML=html;
  container.querySelectorAll('.sim-row').forEach(r=>r.addEventListener('click',()=>openSimDetail(r.dataset.simid)));
  if(autoOpen){
    const target=new URLSearchParams(location.search).get('simulationId');
    const cand=target?sims.find(s=>String(s.id)===String(target)):null;
    if(cand&&cand.id!==latestAutoOpenedId){
      latestAutoOpenedId=cand.id;
      if(target) history.replaceState({},document.title,location.pathname);
      setTimeout(()=>openSimDetail(cand.id),150);
    }
  }
}

// ── RADAR ────────────────────────────────────────────────────
function scoreDiscovery(transcriptions) {
  let q=0,phase='decouverte';
  for(const t of transcriptions||[]){
    const tx=String(t.texte||'').toLowerCase();
    if(/(signature|contrat|prochaine.tape|on signe|on bloque)/i.test(tx)) phase='closing';
    else if(/(trop cher|pas le temps|pas interest|deja un prest)/i.test(tx)) phase='objection';
    else if(/(demo|notre solution|comment.a marche)/i.test(tx)) phase='pitch';
    if(t.locuteur==='commercial'&&phase==='decouverte') q+=(tx.match(/\?/g)||[]).length;
  }
  return Math.min(100,q*15);
}
function buildRadar(m,t) {
  return [
    Math.min(100,Number(m?.ratio_questions_affirmations)||0),
    Math.min(100,Number(m?.taux_resolution_objections)||0),
    scoreDiscovery(t),
    Number(m?.nb_signaux_achat)>0?Math.max(0,Math.min(100,100-(Number(m?.delai_moyen_closing_apres_signal)||0)/60*100)):0,
    Math.max(0,Math.min(100,100-((Number(m?.nb_interruptions)||0)*10+(Number(m?.nb_silences_remplis)||0)*5))),
    Math.min(100,Math.max(0,Number(m?.score_engagement_final)||0))
  ];
}
async function getAvgRadar(sim) {
  const {data:sims}=await supabaseClient.from('simulations').select('id').eq('user_id',currentUser.id).eq('statut','terminee');
  const ids=(sims||[]).map(s=>s.id).filter(id=>id!==sim.id);
  if(!ids.length) return null;
  const {data:metrics}=await supabaseClient.from('metriques').select('*').in('simulation_id',ids);
  if(!metrics?.length) return null;
  const sum=[0,0,0,0,0,0];
  metrics.forEach(m=>{
    const delay=Number(m.delai_moyen_closing_apres_signal)||0;
    const closing=Number(m.nb_signaux_achat)>0?Math.max(0,Math.min(100,100-(delay/60)*100)):0;
    const rhythm=Math.max(0,Math.min(100,100-((Number(m.nb_interruptions)||0)*10+(Number(m.nb_silences_remplis)||0)*5)));
    [Number(m.ratio_questions_affirmations)||0,Number(m.taux_resolution_objections)||0,Math.min(100,(Number(m.nb_questions_qualification)||0)*15),closing,rhythm,Number(m.score_engagement_final)||0].forEach((v,i)=>sum[i]+=v);
  });
  return sum.map(v=>Math.round(v/metrics.length));
}
function radarSvg(current,average) {
  const labels=['Questions','Objections','Découverte','Closing','Rythme','Engagement'];
  const cx=50,cy=50,r=36;
  const pts=vals=>vals.map((v,i)=>{
    const a=-Math.PI/2+i*(Math.PI*2/labels.length);
    const rv=r*(Math.max(0,Math.min(100,v))/100);
    return `${cx+Math.cos(a)*rv},${cy+Math.sin(a)*rv}`;
  }).join(' ');
  const grid=[25,50,75,100].map(l=>`<polygon points="${pts(labels.map(()=>l))}" fill="none" stroke="var(--border-2)" stroke-width="0.4"/>`).join('');
  const axes=labels.map((l,i)=>{
    const a=-Math.PI/2+i*(Math.PI*2/labels.length);
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    const lx=cx+Math.cos(a)*44,ly=cy+Math.sin(a)*44;
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border-2)" stroke-width="0.3"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="3.9" fill="var(--text-3)">${escapeHtml(l)}</text>`;
  }).join('');
  const avg=average?`<polygon points="${pts(average)}" fill="rgba(109,40,217,.06)" stroke="var(--purple)" stroke-width="0.9" stroke-dasharray="2 1.5"/>`:''
  return `<svg class="radar-svg" viewBox="0 0 100 100"><g>${grid}${axes}${avg}<polygon points="${pts(current)}" fill="rgba(0,87,255,.08)" stroke="var(--accent)" stroke-width="1.2"/></g></svg>`;
}

function renderPrevSims(targetPhase){
  const prev=wizardState.previousSimulations.filter(s=>isCompatible(s,targetPhase));
  if(!prev.length) return '<div style="margin-top:12px;font-size:12px;color:var(--text-3)">Aucune simulation précédente compatible.</div>';
  let h='<div class="w-kicker">Simulation précédente</div><div class="prev-list">';
  prev.forEach(sim=>{
    const req=sim.type_entretien==='cold_call',sel=wizardState.simulation_precedente_id===sim.id;
    h+=`<div class="prev-item ${sel?'selected':''}" onclick="selectPrevSim('${escapeHtml(sim.id)}')"><div class="prev-title">${escapeHtml(getSimLabel(sim))}</div><div class="prev-meta">${formatDate(sim.created_at)} · ${sim.b2b_b2c?sim.b2b_b2c.toUpperCase():''}</div><div class="prev-compat ${req?'warn':'ok'}">${req?'Continuation → RDV après résultat du Cold Call':'Transition compatible'}</div></div>`;
  });
  h+='</div>';
  if(wizardState.simulation_precedente_id){
    const s=wizardState.previousSimulations.find(x=>x.id===wizardState.simulation_precedente_id);
    if(s&&s.type_entretien==='rdv'){
      h+=`<div class="w-kicker">Continuité du rendez-vous</div><div class="cont-grid">
        <button class="cont-card ${wizardState.continuite_rdv==='meme_rdv'?'selected':''}" onclick="selectCont('meme_rdv')"><div class="cont-title">Même rendez-vous</div><div class="cont-desc">Reprend comme si ça ne s'était pas arrêté.</div></button>
        <button class="cont-card ${wizardState.continuite_rdv==='nouveau_rdv'?'selected':''}" onclick="selectCont('nouveau_rdv')"><div class="cont-title">Nouveau rendez-vous</div><div class="cont-desc">Le prospect garde la mémoire du précédent.</div></button>
      </div>`;
    } else { h+='<div class="w-help" style="margin-top:8px">Un Cold Call continué vers un RDV devient un nouveau rendez-vous.</div>'; }
  }
  return h;
}

function isCompatible(sim,targetPhase){
  if(sim.b2b_b2c&&sim.b2b_b2c!==wizardState.b2b_b2c) return false;
  if(sim.type_entretien==='cold_call') return wizardState.type_entretien==='rdv'&&['complet','decouverte'].includes(targetPhase);
  if(wizardState.type_entretien!=='rdv') return false;
  if(targetPhase==='demo') return sim.phase_choisie==='decouverte';
  if(targetPhase==='objections_closing') return sim.phase_choisie==='demo';
  if(targetPhase==='nego') return sim.phase_choisie==='objections_closing';
  if(targetPhase==='complet') return ['decouverte','demo','objections_closing','nego'].includes(sim.phase_choisie);
  if(targetPhase==='decouverte') return sim.phase_choisie==='complet';
  return false;
}

function selectB2bB2c(v){ Object.assign(wizardState,{b2b_b2c:v,prospect_role:'',prospect_type_entreprise:'',prospect_url:'',prospect_profile:''}); renderWizard(); }
function selectInterviewType(v){ Object.assign(wizardState,{type_entretien:v,phase_choisie:v==='cold_call'?null:wizardState.phase_choisie,simulation_precedente_id:null,continuite_rdv:null,continuationMode:'new'}); renderWizard(); }
function selectContinuationMode(m){ wizardState.continuationMode=m; if(m==='new'){wizardState.simulation_precedente_id=null;wizardState.continuite_rdv=null;} renderWizard(); }
function selectPrevSim(id){ wizardState.simulation_precedente_id=id; const s=wizardState.previousSimulations.find(x=>x.id===id); wizardState.continuite_rdv=s?.type_entretien==='cold_call'?'nouveau_rdv':wizardState.continuite_rdv; renderWizard(); }
function selectCont(v){ wizardState.continuite_rdv=v; renderWizard(); }

function wizardBack(){ if(wizardState.step>1){wizardState.step--;renderWizard();} }

function validateStep(){
  const el=$('wizard-error'); if(el){el.classList.remove('show');el.textContent='';}
  const fail=msg=>{if(el){el.textContent=msg;el.classList.add('show');}return false;};
  if(wizardState.step===1&&!wizardState.b2b_b2c) return fail('Choisis B2B ou B2C.');
  if(wizardState.step===2){
    if(!wizardState.vendeur_type_entreprise.trim()&&!wizardState.vendeur_url.trim()) return fail("Renseigne le type d'entreprise vendeur ou fournis une URL.");
    if(!wizardState.vendeur_produit.trim()&&!wizardState.vendeur_url.trim()) return fail("Renseigne le produit / service vendu ou fournis une URL.");
    if(wizardState.b2b_b2c==='b2b'){
      if(!wizardState.prospect_role) return fail('Choisis le rôle du prospect.');
      if(!wizardState.prospect_type_entreprise.trim()&&!wizardState.prospect_url.trim()) return fail("Renseigne le type d'entreprise du prospect ou fournis une URL.");
    } else if(!wizardState.prospect_profile.trim()) return fail('Décris le profil du prospect B2C.');
  }
  if(wizardState.step===3){
    if(!wizardState.type_entretien) return fail('Choisis Cold Call ou RDV.');
    if(wizardState.type_entretien==='rdv'&&!wizardState.phase_choisie) return fail('Choisis la phase du RDV.');
  }
  if(wizardState.step===4&&wizardState.continuationMode==='continue'&&!wizardState.simulation_precedente_id) return fail('Choisis une simulation précédente.');
  return true;
}

function triggerPrewarm(){
  if(wizardState.simulation_precedente_id) return;
  if(!wizardState.sessionId) wizardState.sessionId=(crypto.randomUUID&&crypto.randomUUID())||`s_${Date.now()}_${Math.random().toString(36).slice(2)}`;
  simulationApi('/api/simulation/prewarm',{method:'POST',body:JSON.stringify({sessionId:wizardState.sessionId,b2b_b2c:wizardState.b2b_b2c,vendeur_type_entreprise:wizardState.vendeur_type_entreprise.trim(),vendeur_produit:wizardState.vendeur_produit.trim(),vendeur_url:wizardState.vendeur_url.trim()||null,prospect_role:wizardState.b2b_b2c==='b2b'?wizardState.prospect_role:null,prospect_type_entreprise:wizardState.b2b_b2c==='b2b'?wizardState.prospect_type_entreprise.trim():null,prospect_url:wizardState.b2b_b2c==='b2b'?(wizardState.prospect_url.trim()||null):null,prospect_profile:wizardState.b2b_b2c==='b2c'?wizardState.prospect_profile.trim():null,type_entretien:wizardState.type_entretien,phase_choisie:wizardState.type_entretien==='rdv'?wizardState.phase_choisie:null})}).catch(()=>{});
}

function wizardNext(){
  if(!validateStep()) return;
  if(wizardState.step<4){ wizardState.step++; if(wizardState.step===4){if(!wizardState.continuationMode)wizardState.continuationMode='new';triggerPrewarm();} renderWizard(); }
}

async function analyzeWizardUrl(target){
  const url=target==='vendeur'?wizardState.vendeur_url:wizardState.prospect_url;
  if(!url.trim()) return;
  const btn=document.querySelector(target==='vendeur'?'#vendeur-url + .btn-analyze':'#prospect-url + .btn-analyze');
  if(btn){btn.disabled=true;btn.textContent='Analyse…';}
  try {
    const r=await simulationApi('/api/analyze-url',{method:'POST',body:JSON.stringify({url:url.trim(),cible:target,b2b_b2c:wizardState.b2b_b2c,prospect_role:wizardState.prospect_role})});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||'Analyse impossible');
    if(target==='vendeur'){
      if(!wizardState.vendeur_type_entreprise&&d.type_entreprise) wizardState.vendeur_type_entreprise=d.type_entreprise;
      if(!wizardState.vendeur_produit&&d.produit_service) wizardState.vendeur_produit=d.produit_service;
      renderWizard(); const b=$('vendeur-analysis'); if(b){b.textContent='Analyse terminée. Vérifie et corrige si besoin.';b.classList.add('show');}
    } else {
      if(!wizardState.prospect_type_entreprise&&d.type_entreprise_prospect) wizardState.prospect_type_entreprise=d.type_entreprise_prospect;
      renderWizard(); const b=$('prospect-analysis'); if(b){b.textContent='Analyse terminée. Vérifie et corrige si besoin.';b.classList.add('show');}
    }
  } catch(err){ alert(`Erreur d'analyse URL : ${err.message}`); }
  finally { if(btn){btn.disabled=false;btn.textContent='Analyser';} }
}

// ── CREATE SIMULATION — handshake AVANT création ──────────────
async function createSimulation(){
  if(!validateStep()) return;
  const button=$('startSimulationBtn');
  if(button){button.disabled=true;button.textContent='Création…';}
  try {
    const payload={
      sessionId:wizardState.continuationMode==='new'?(wizardState.sessionId||null):null,
      b2b_b2c:wizardState.b2b_b2c,
      vendeur_type_entreprise:wizardState.vendeur_type_entreprise.trim(),
      vendeur_produit:wizardState.vendeur_produit.trim(),
      vendeur_url:wizardState.vendeur_url.trim()||null,
      prospect_role:wizardState.b2b_b2c==='b2b'?wizardState.prospect_role:null,
      prospect_type_entreprise:wizardState.b2b_b2c==='b2b'?wizardState.prospect_type_entreprise.trim():null,
      prospect_url:wizardState.b2b_b2c==='b2b'?(wizardState.prospect_url.trim()||null):null,
      prospect_profile:wizardState.b2b_b2c==='b2c'?wizardState.prospect_profile.trim():null,
      type_entretien:wizardState.type_entretien,
      phase_choisie:wizardState.type_entretien==='rdv'?wizardState.phase_choisie:null,
      simulation_precedente_id:wizardState.continuationMode==='continue'?wizardState.simulation_precedente_id:null,
      continuite_rdv:wizardState.continuationMode==='continue'?wizardState.continuite_rdv:null
    };

    // ÉTAPE 1 — handshake d'abord : si ça échoue, rien n'est créé en BDD
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session?.access_token||!session?.refresh_token) throw new Error('Session Supabase introuvable.');
    const hR=await fetch(`${SIMULATION_APP_URL}/api/auth/handshake`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({refresh_token:session.refresh_token})});
    if(!hR.ok) throw new Error('Handshake impossible — réessaie dans quelques secondes.');
    const {code}=await hR.json();

    // ÉTAPE 2 — création simulation (handshake réussi)
    const r=await simulationApi('/api/simulation/start',{method:'POST',body:JSON.stringify(payload)});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||'Impossible de créer la simulation');

    // ÉTAPE 3 — redirect avec code uniquement
    closeModal();
    window.location.href=`${SIMULATION_APP_URL}/?code=${encodeURIComponent(code)}&simulationId=${encodeURIComponent(d.simulationId)}`;
  } catch(err){
    const el=$('wizard-error'); if(el){el.textContent=err.message;el.classList.add('show');}
    if(button){button.disabled=false;button.textContent='Créer la simulation';}
  }
}

// ── RANKING ──────────────────────────────────────────────────
async function loadRankingView(container){
  container.innerHTML='<div class="empty-state"><p>Chargement…</p></div>';
  let q=supabaseClient.from('simulations').select('user_id,bilans(note_globale),profiles(nom,prenom)').eq('statut','terminee');
  if(currentProfile?.role==='commercial') q=q.eq('user_id',currentUser.id);
  const {data:sims,error}=await q;
  if(error){container.innerHTML=`<div class="empty-state"><p>Erreur : ${escapeHtml(error.message)}</p></div>`;return;}
  const us={};
  (sims||[]).forEach(s=>{const uid=s.user_id;if(!us[uid])us[uid]={total:0,count:0,profile:s.profiles};const n=s.bilans?.[0]?.note_globale;if(n!=null){us[uid].total+=Number(n);us[uid].count++;}});
  const ranking=Object.keys(us).map(uid=>({uid,avg:us[uid].count?Math.round(us[uid].total/us[uid].count):0,profile:us[uid].profile})).sort((a,b)=>b.avg-a.avg);
  let h=`<div class="section-head"><div class="section-title">Classement global</div><span class="section-count">${ranking.length}</span></div><div class="rank-grid" style="margin-top:12px">`;
  if(!ranking.length) h+='<div class="empty-state"><p>Aucune donnée.</p></div>';
  else ranking.forEach((item,i)=>{
    const name=item.profile?`${item.profile.prenom||''} ${item.profile.nom||''}`.trim():'Utilisateur';
    const pc=i===0?'p1':i===1?'p2':i===2?'p3':'pN';
    h+=`<div class="rank-card"><div class="rank-pos ${pc}">${i+1}</div><div><div class="rank-name">${escapeHtml(name)}</div><div class="rank-score">${item.avg}/100</div></div></div>`;
  });
  h+='</div>';
  container.innerHTML=h;
}

$('loginBtn').addEventListener('click',handleLogin);
$('passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin();});
$('logoutBtn').addEventListener('click',handleLogout);
$('refreshBtn').addEventListener('click',()=>loadView(currentView));
$('modalClose').addEventListener('click',closeModal);
$('modalOverlay').addEventListener('click',e=>{if(e.target===$('modalOverlay'))closeModal();});
$('launchSimBtn').addEventListener('click',openWizard);

// ── INIT ─────────────────────────────────────────────────────
(async()=>{
  try {
    const {data:{session},error}=await supabaseClient.auth.getSession();
    if(error) console.error('[Dashboard]',error);
    if(session){currentUser=session.user;await loadProfile();}
    else showLogin(true);
  } catch(err){console.error('[Dashboard]',err);showLogin(true);}
})();
</script>
