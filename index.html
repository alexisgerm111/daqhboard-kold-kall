<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kold Kall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--font-display:'Plus Jakarta Sans',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;
--l-bg:#F5F3EE;--l-surface:#FFFFFF;--l-surf2:#EFECE6;--l-surf3:#E4E0D7;--l-border:#DDD9CF;
--l-accent:#6D28D9;--l-accentL:#7C3AED;--l-accentBg:#F0EBFF;
--l-t1:#1A1322;--l-t2:#3D3550;--l-t3:#7B7290;--l-t4:#ADA8BC;
--l-green:#059669;--l-greenBg:#ECFDF5;--l-amber:#B45309;--l-amberBg:#FFFBEB;--l-red:#DC2626;--l-redBg:#FEF2F2;
--d-bg:#0D0B14;--d-surface:#141128;--d-surf2:#1D1A32;--d-surf3:#252242;--d-border:#2E2A4A;
--d-accent:#A78BFA;--d-accentL:#C4B5FD;--d-accentBg:rgba(167,139,250,.12);
--d-t1:#F0EEFF;--d-t2:#B8B2D4;--d-t3:#736D92;--d-t4:#3E3960;
--d-green:#34D399;--d-greenBg:rgba(52,211,153,.1);--d-amber:#FCD34D;--d-amberBg:rgba(252,211,77,.1);
--d-red:#F87171;--d-redBg:rgba(248,113,113,.1);--ease:cubic-bezier(.4,0,.2,1);}
[data-theme="light"]{--bg:var(--l-bg);--surface:var(--l-surface);--surf2:var(--l-surf2);--surf3:var(--l-surf3);--border:var(--l-border);--accent:var(--l-accent);--accentL:var(--l-accentL);--accentBg:var(--l-accentBg);--t1:var(--l-t1);--t2:var(--l-t2);--t3:var(--l-t3);--t4:var(--l-t4);--green:var(--l-green);--greenBg:var(--l-greenBg);--amber:var(--l-amber);--amberBg:var(--l-amberBg);--red:var(--l-red);--redBg:var(--l-redBg);}
[data-theme="dark"]{--bg:var(--d-bg);--surface:var(--d-surface);--surf2:var(--d-surf2);--surf3:var(--d-surf3);--border:var(--d-border);--accent:var(--d-accent);--accentL:var(--d-accentL);--accentBg:var(--d-accentBg);--t1:var(--d-t1);--t2:var(--d-t2);--t3:var(--d-t3);--t4:var(--d-t4);--green:var(--d-green);--greenBg:var(--d-greenBg);--amber:var(--d-amber);--amberBg:var(--d-amberBg);--red:var(--d-red);--redBg:var(--d-redBg);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{font-family:var(--font-body);background:var(--bg);color:var(--t1);min-height:100dvh;-webkit-font-smoothing:antialiased;transition:background .25s var(--ease),color .25s var(--ease);overflow:hidden;}
button,input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--surf2);border-radius:6px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;min-height:40px;}
::-webkit-scrollbar-thumb:hover{background:var(--t4);}
*{scrollbar-width:thin;scrollbar-color:var(--border) var(--surf2);}
#login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9999;}
.login-wrap{width:min(380px,92vw);display:flex;flex-direction:column;gap:0;}
.login-eyebrow{font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-bottom:10px;}
.login-headline{font-family:var(--font-display);font-size:32px;font-weight:800;line-height:1.1;letter-spacing:-.5px;color:var(--t1);margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--t3);line-height:1.6;margin-bottom:32px;}
.login-form{display:flex;flex-direction:column;gap:14px;}
.f-label{display:block;font-size:11px;font-weight:600;color:var(--t3);margin-bottom:5px;letter-spacing:.02em;}
.f-input{width:100%;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--t1);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;}
.f-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg);}
.f-input::placeholder{color:var(--t4);}
.login-err{font-size:12px;color:var(--red);background:var(--redBg);padding:8px 12px;border-radius:6px;display:none;}
.btn-main{width:100%;padding:13px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:var(--font-display);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:-.1px;transition:opacity .15s,transform .1s;}
.btn-main:hover{opacity:.92;}
.btn-main:active{transform:scale(.98);}
.btn-main:disabled{opacity:.45;cursor:wait;}
.login-theme{position:absolute;top:20px;right:20px;}
.theme-pill{display:inline-flex;align-items:center;gap:2px;background:var(--surf2);border:1px solid var(--border);border-radius:99px;padding:3px;cursor:pointer;}
.theme-opt{width:28px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .15s,color .15s;color:var(--t3);background:transparent;border:none;cursor:pointer;}
.theme-opt.on{background:var(--surface);color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.15);}
#app{display:none;height:100dvh;flex-direction:column;overflow:hidden;}
.nav{height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 24px;gap:0;border-bottom:1px solid var(--border);background:var(--surface);position:relative;z-index:50;}
.nav-logo{font-family:var(--font-display);font-size:15px;font-weight:800;letter-spacing:-.3px;color:var(--t1);display:flex;align-items:center;gap:8px;margin-right:32px;flex-shrink:0;}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.nav-tabs{display:flex;gap:0;flex:1;}
.nav-tab{padding:0 16px;height:52px;display:flex;align-items:center;font-size:13px;font-weight:500;color:var(--t3);border:none;background:transparent;cursor:pointer;position:relative;transition:color .15s;border-bottom:2px solid transparent;margin-bottom:-1px;}
.nav-tab:hover{color:var(--t1);}
.nav-tab.active{color:var(--t1);font-weight:600;border-bottom-color:var(--accent);}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.user-pill{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;background:var(--surf2);border:1px solid var(--border);border-radius:99px;cursor:pointer;transition:background .15s;}
.user-pill:hover{background:var(--surf3);}
.user-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accentL));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
.user-name-pill{font-size:12px;font-weight:500;color:var(--t2);}
.btn-launch{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:var(--font-display);font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;white-space:nowrap;flex-shrink:0;}
.btn-launch:hover{opacity:.9;}
.btn-launch:active{transform:scale(.98);}
.btn-launch:disabled{opacity:.45;cursor:wait;}
.btn-launch svg{width:14px;height:14px;}
.main-content{flex:1;overflow-y:auto;padding:32px 32px 40px;display:flex;flex-direction:column;gap:24px;}
.hero-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:60px 20px;}
.hero-icon{width:64px;height:64px;border-radius:16px;background:var(--accentBg);display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
.hero-icon svg{width:32px;height:32px;color:var(--accent);}
.hero-title{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-.4px;color:var(--t1);}
.hero-sub{font-size:14px;color:var(--t3);line-height:1.6;max-width:380px;}
.journal-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
.journal-title{font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.4px;color:var(--t1);}
.journal-count{font-size:12px;color:var(--t3);background:var(--surf2);border:1px solid var(--border);padding:3px 10px;border-radius:99px;}
.journal{display:flex;flex-direction:column;gap:2px;}
.session-row{display:grid;grid-template-columns:4px 1fr auto auto auto;align-items:center;gap:0 20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px 16px 0;cursor:pointer;transition:border-color .15s,transform .12s,box-shadow .15s;overflow:hidden;position:relative;}
.session-row:hover{border-color:var(--accent);transform:translateX(2px);box-shadow:0 4px 20px rgba(0,0,0,.12);}
.session-stripe{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:10px 0 0 10px;transition:opacity .15s;}
.session-stripe.high{background:var(--green);}
.session-stripe.medium{background:var(--amber);}
.session-stripe.low{background:var(--red);}
.session-stripe.none{background:var(--border);}
.session-info{padding-left:20px;}
.session-name{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--t1);letter-spacing:-.1px;margin-bottom:4px;}
.session-date{font-size:12px;color:var(--t3);}
.session-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;}
.session-status.terminee{background:var(--greenBg);color:var(--green);}
.session-status.en_cours{background:var(--amberBg);color:var(--amber);}
.session-status.preparation{background:var(--surf2);color:var(--t3);border:1px solid var(--border);}
.session-status.erreur_preparation{background:var(--redBg);color:var(--red);}
.session-dur{font-size:13px;color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap;}
.session-score{font-family:var(--font-display);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:60px;text-align:right;}
.session-score.high{color:var(--green);}
.session-score.medium{color:var(--amber);}
.session-score.low{color:var(--red);}
.session-score.none{color:var(--t4);font-size:13px;font-weight:500;}
.ranking-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.rank-entry{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;display:flex;align-items:center;gap:14px;transition:border-color .15s,transform .12s;}
.rank-entry:hover{border-color:var(--accent);transform:translateY(-2px);}
.rank-number{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.5px;min-width:36px;text-align:center;line-height:1;}
.rank-number.r1{color:var(--amber);}
.rank-number.r2{color:var(--t3);}
.rank-number.r3{color:var(--amber);opacity:.6;}
.rank-number.rN{color:var(--t4);font-size:20px;}
.rank-name{font-size:14px;font-weight:600;color:var(--t1);}
.rank-avg{font-size:12px;color:var(--t3);margin-top:2px;font-variant-numeric:tabular-nums;}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s var(--ease);backdrop-filter:blur(2px);}
.drawer-overlay.open{opacity:1;pointer-events:all;}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--border);z-index:101;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s var(--ease);overflow:hidden;}
.drawer-overlay.open .drawer{transform:translateX(0);}
.drawer-head{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.drawer-title{font-family:var(--font-display);font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--t1);}
.drawer-close{width:32px;height:32px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);font-size:18px;transition:background .15s,color .15s;}
.drawer-close:hover{background:var(--surf3);color:var(--t1);}
.drawer-progress{height:3px;background:var(--surf3);flex-shrink:0;}
.drawer-bar{height:100%;background:var(--accent);transition:width .35s var(--ease);border-radius:0 99px 99px 0;}
.drawer-body{flex:1;overflow-y:scroll;padding:24px;}
.drawer-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-shrink:0;background:var(--surface);}
.drawer-step-label{font-size:11px;color:var(--t3);font-weight:500;}
.step-title{font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:-.3px;color:var(--t1);margin-bottom:6px;}
.step-sub{font-size:13px;color:var(--t3);line-height:1.65;margin-bottom:24px;}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.pick-card{border:1.5px solid var(--border);border-radius:10px;padding:16px;background:var(--surf2);cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .1s;}
.pick-card:hover{border-color:var(--accent);background:var(--surface);}
.pick-card.sel{border-color:var(--accent);background:var(--accentBg);}
.pick-card:active{transform:scale(.98);}
.pick-label{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--t1);margin-bottom:4px;}
.pick-desc{font-size:11px;color:var(--t3);line-height:1.5;}
.section-sep{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.05em;margin:20px 0 10px;display:flex;align-items:center;gap:10px;}
.section-sep::after{content:'';flex:1;height:1px;background:var(--border);}
.field-block{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.d-label{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.02em;}
.d-input{width:100%;padding:9px 12px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;color:var(--t1);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;}
.d-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg);}
.d-input::placeholder{color:var(--t4);}
.d-select{width:100%;padding:9px 12px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;color:var(--t1);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%237B7290' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;}
.d-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg);}
.d-textarea{width:100%;min-height:90px;resize:vertical;padding:9px 12px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;color:var(--t1);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;line-height:1.6;}
.d-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg);}
.d-textarea::placeholder{color:var(--t4);}
.url-pair{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;}
.btn-analyze{padding:9px 14px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s,background .15s;}
.btn-analyze:hover{border-color:var(--accent);color:var(--accent);}
.btn-analyze:disabled{opacity:.45;cursor:wait;}
.analyze-result{display:none;margin-top:7px;padding:8px 12px;background:var(--accentBg);border:1px solid rgba(167,139,250,.2);border-radius:7px;font-size:12px;color:var(--accent);line-height:1.5;}
.analyze-result.show{display:block;}
.w-error{display:none;margin-top:14px;padding:9px 12px;background:var(--redBg);border:1px solid rgba(248,113,113,.2);border-radius:7px;font-size:12px;color:var(--red);}
.w-error.show{display:block;}
.prev-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;}
.prev-item{border:1.5px solid var(--border);border-radius:8px;background:var(--surf2);padding:10px 12px;cursor:pointer;transition:border-color .15s,background .15s;}
.prev-item:hover{border-color:var(--accent);}
.prev-item.sel{border-color:var(--accent);background:var(--accentBg);}
.prev-item-name{font-size:13px;font-weight:600;color:var(--t1);}
.prev-item-meta{font-size:11px;color:var(--t3);margin-top:2px;}
.btn-prev{padding:9px 18px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s;}
.btn-prev:hover{background:var(--surf2);}
.btn-next{padding:9px 22px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:var(--font-display);font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn-next:hover{opacity:.9;}
.btn-next:active{transform:scale(.98);}
.btn-next:disabled{opacity:.4;cursor:wait;}
.intensite-block{background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.intensite-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.intensite-label{font-size:13px;font-weight:700;color:var(--t1);}
.intensite-value{font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--accent);}
.intensite-slider{width:100%;accent-color:var(--accent);margin-bottom:8px;}
.intensite-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--t3);font-weight:600;}
.intensite-desc{font-size:11px;color:var(--t3);margin-top:8px;line-height:1.5;text-align:center;font-style:italic;}
.saved-info{font-size:11px;color:var(--green);background:var(--greenBg);padding:6px 10px;border-radius:6px;margin-top:8px;display:none;}
.saved-info.show{display:block;}
.btn-small{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 12px;background:var(--surf3);border:1px solid var(--border);border-radius:7px;font-size:11px;font-weight:600;color:var(--t2);cursor:pointer;transition:all .15s;}
.btn-small:hover{background:var(--surface);color:var(--accent);border-color:var(--accent);}
.final-create-block{margin-top:20px;padding-top:20px;border-top:1px solid var(--border);display:none;}
.final-create-block.show{display:block;}
.btn-create{width:100%;padding:13px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:var(--font-display);font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn-create:hover{opacity:.9;}
.btn-create:active{transform:scale(.98);}
.btn-create:disabled{opacity:.5;cursor:wait;}
.debrief-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;transform:translateY(100%);transition:transform .35s var(--ease);overflow-y:scroll;display:flex;flex-direction:column;}
.debrief-overlay.open{transform:translateY(0);}
.debrief-nav{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:52px;display:flex;align-items:center;justify-content:space-between;z-index:10;flex-shrink:0;}
.debrief-back{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--t2);background:none;border:none;cursor:pointer;transition:color .15s;}
.debrief-back:hover{color:var(--t1);}
.debrief-back svg{width:16px;height:16px;}
.debrief-session-name{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--t1);}
.debrief-actions{display:flex;gap:8px;}
.btn-save-persona{padding:8px 14px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;transition:all .15s;}
.btn-save-persona:hover{border-color:var(--accent);color:var(--accent);}
.debrief-body{max-width:860px;width:100%;margin:0 auto;padding:40px 32px 60px;display:flex;flex-direction:column;gap:28px;}
.db-hero{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;}
.db-tagline{font-family:var(--font-display);font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.5px;color:var(--t1);max-width:520px;}
.db-meta{font-size:12px;color:var(--t3);margin-top:8px;line-height:1.6;}
.db-score-block{text-align:right;flex-shrink:0;}
.db-score{font-family:var(--font-display);font-size:48px;font-weight:800;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;}
.db-score.high{color:var(--green);}
.db-score.medium{color:var(--amber);}
.db-score.low{color:var(--red);}
.db-score.none{color:var(--t4);font-size:28px;}
.db-score-label{font-size:12px;color:var(--t3);margin-top:4px;}
.db-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.db-section-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.db-section-title{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--t1);letter-spacing:-.1px;}
.db-section-body{padding:20px;}
.radar-svg{width:220px;height:220px;display:block;margin:0 auto;}
.radar-legend{display:flex;gap:16px;justify-content:center;font-size:11px;color:var(--t3);margin-top:10px;}
.rdot{width:14px;height:0;border-top:2px solid var(--accent);display:inline-block;}
.rdot.avg{border-top-style:dashed;border-top-color:rgba(167,139,250,.6);}
.radar-axes-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;font-size:11px;}
.radar-axes-legend .item{background:var(--surf2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;}
.radar-axes-legend .k{color:var(--t3);font-weight:600;font-size:10px;}
.radar-axes-legend .v{font-family:var(--font-display);font-weight:800;color:var(--t1);font-size:14px;margin-top:2px;}
.radar-axes-legend .v.na{color:var(--t4);font-style:italic;font-weight:500;}
.metrics-flex{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
.m-cell{display:flex;flex-direction:column;gap:3px;}
.m-val{font-family:var(--font-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--t1);letter-spacing:-.5px;line-height:1;}
.m-label{font-size:11px;color:var(--t3);}
.m-sub{font-size:10px;color:var(--t4);}
.db-accordion{border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.db-accordion+.db-accordion{margin-top:8px;}
.db-acc-head{padding:14px 20px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;transition:background .15s;}
.db-acc-head:hover{background:var(--surf2);}
.db-acc-title{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--t1);}
.db-acc-icon{font-size:18px;color:var(--t3);font-weight:400;transition:transform .2s;}
details[open] .db-acc-icon{transform:rotate(45deg);}
details[open] .db-acc-head{border-bottom:1px solid var(--border);}
.db-acc-body{padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
.qi{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px;}
.qi-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.chip{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;}
.chip-t{background:var(--accentBg);color:var(--accent);}
.chip-c{background:var(--surf3);color:var(--t3);border:1px solid var(--border);}
.chip-f{background:rgba(109,40,217,.1);color:#7C3AED;}
[data-theme="dark"] .chip-f{background:rgba(167,139,250,.15);color:var(--accent);}
.chip-adapt{background:var(--greenBg);color:var(--green);}
.chip-inst{background:var(--amberBg);color:var(--amber);}
.chip-mank{background:var(--redBg);color:var(--red);}
.qi-text{font-size:12px;line-height:1.65;color:var(--t2);}
.qi-note{font-size:10px;color:var(--t4);margin-top:6px;line-height:1.5;}
.dist-rows{display:flex;flex-direction:column;gap:10px;}
.dist-row{display:grid;grid-template-columns:90px 1fr 38px;gap:10px;align-items:center;}
.dist-key{font-size:12px;color:var(--t2);text-transform:capitalize;}
.dist-track{height:5px;background:var(--surf3);border-radius:99px;overflow:hidden;}
.dist-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accentL));border-radius:99px;}
.dist-pct{font-size:11px;color:var(--t3);text-align:right;font-variant-numeric:tabular-nums;}
.an-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.an-cell{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px;}
.an-cell strong{display:block;font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.05em;margin-bottom:6px;text-transform:uppercase;}
.an-cell div{font-size:12px;line-height:1.6;color:var(--t2);}
.audio-block{padding:4px 0;}
.audio-block audio{width:100%;accent-color:var(--accent);}
.audio-na{padding:16px;text-align:center;font-size:12px;color:var(--t3);}
.transcript-wrap{overflow:hidden;}
.t-head{padding:12px 20px;background:var(--surf2);border-bottom:1px solid var(--border);font-size:11px;color:var(--t3);font-weight:500;}
.t-scroll{max-height:320px;overflow-y:scroll;}
.t-row{display:grid;grid-template-columns:42px 90px 1fr;gap:10px;padding:10px 20px;border-bottom:1px solid var(--surf2);cursor:pointer;transition:background .1s;font-size:12px;}
.t-row:hover{background:var(--surf2);}
.t-row.active{background:var(--accentBg);box-shadow:inset 3px 0 0 var(--accent);}
.t-row.bascule{background:var(--amberBg);box-shadow:inset 3px 0 0 var(--amber);}
.t-time{color:var(--t4);font-size:10px;font-variant-numeric:tabular-nums;padding-top:1px;}
.t-who{font-weight:600;color:var(--t3);}
.t-who.c{color:var(--accent);}
.t-text{color:var(--t2);line-height:1.55;}
.moment-btn{background:var(--accentBg);color:var(--accent);border:none;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.moment-btn:hover{opacity:.8;}
.bilan-gen{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:16px 20px;}
.bg-left{flex:1;min-width:0;}
.bg-title{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:4px;}
.bg-sub{font-size:11px;color:var(--t3);}
.sens-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
.sens-row input{flex:1;accent-color:var(--accent);}
.sens-val{font-size:12px;font-weight:700;color:var(--accent);min-width:28px;text-align:right;font-variant-numeric:tabular-nums;}
.btn-gen{padding:10px 18px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:var(--font-display);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:opacity .15s,transform .1s;}
.btn-gen:hover{opacity:.9;}
.btn-gen:active{transform:scale(.98);}
.btn-gen:disabled{opacity:.4;cursor:wait;}
@media(max-width:640px){
.main-content{padding:20px 16px;}
.debrief-body{padding:24px 16px 48px;}
.field-row-2,.pick-grid,.an-grid{grid-template-columns:1fr;}
.session-row{grid-template-columns:4px 1fr auto;gap:0 12px;}
.session-dur{display:none;}
.db-hero{flex-direction:column;}
.db-score{font-size:36px;}
.nav-tabs .nav-tab span{display:none;}
.bilan-gen{flex-direction:column;align-items:stretch;}
.radar-axes-legend{grid-template-columns:1fr 1fr;}
}

<script>
const SUPABASE_URL='https://vjvyzbojcbwmfudkamlh.supabase.co';
const SUPABASE_KEY='sb_publishable_H-wuFrWTNgDEP0fwSWnqNg_c8dJMQZM';
const SIM_URL='https://agent-vocal-39hz.onrender.com';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let me=null,myProfile=null,currentView='sessions',latestAutoOpen=null;
let currentDebriefSimId=null;

const ws={
  step:1,sessionId:null,b2b_b2c:null,
  mode:null,
  v_type:'',v_product:'',v_url:'',
  p_role:'',p_type:'',p_url:'',p_profile:'',
  interview:null,phase:null,
  prev_id:null,cont:null,contMode:null,prevSims:[],
  intensite:3,
  savedPersonaId:null,
  savedVendeurId:null,
  savedPersonas:[],
  savedVendeurs:[]
};

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const fmtDate=d=>{const dt=new Date(d);return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})+' · '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});};
const fmtDur=s=>{const n=Math.max(0,Number(s)||0);return `${Math.floor(n/60)}m${String(Math.floor(n%60)).padStart(2,'0')}`;};
const fmtSec=s=>{const n=Math.max(0,Number(s)||0);return `${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`;};
const fmtM=(v,suf='')=>{const n=Number(v);return Number.isFinite(n)?`${Math.round(n)}${suf}`:'—';};
const ncls=n=>{const s=Number(n)||0;return s>=70?'high':s>=50?'medium':'low';};
const simLabel=sim=>{if(sim.type_entretien==='cold_call')return 'Cold Call';return ({complet:'Entretien complet',decouverte:'Découverte',demo:'Démo',objections_closing:'Objections & Closing',nego:'Négociation'}[sim.phase_choisie]||sim.type_scenario||'Rendez-vous');};
const initials=(n,p)=>(p?.[0]||'')+(n?.[0]||'');
const INTENSITE_DESCS={1:'Très ouvert, facile à convaincre',2:'Plutôt ouvert, quelques réserves',3:'Neutre : ni ouvert ni fermé',4:'Méfiant, demande à être convaincu',5:'Très difficile, exigeant voire agressif'};

async function apiCall(path,opts={}){
  const{data}=await sb.auth.getSession();
  const tok=data?.session?.access_token;
  const hdrs={...(opts.body?{'Content-Type':'application/json'}:{}),...(tok?{Authorization:`Bearer ${tok}`}:{}),...(opts.headers||{})};
  return fetch(`${SIM_URL}${path}`,{...opts,headers:hdrs});
}

function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('kk-theme',t);['themeLight','themeDark','appThemeLight','appThemeDark'].forEach(id=>{const el=$(id);if(!el)return;el.classList.toggle('on',id.includes(t==='light'?'Light':'Dark'));});}
applyTheme(localStorage.getItem('kk-theme')||'dark');
['themeLight','themeDark','appThemeLight','appThemeDark'].forEach(id=>{const el=$(id);if(el)el.addEventListener('click',()=>applyTheme(id.includes('Light')?'light':'dark'));});

function showLogin(v){$('login-screen').style.display=v?'flex':'none';$('app').style.display=v?'none':'flex';}
function showLoginErr(m){const e=$('loginErr');e.style.display=m?'block':'none';e.textContent=m||'';}

async function handleLogin(){
  showLoginErr('');
  const email=$('emailInput').value.trim(),pwd=$('passwordInput').value;
  if(!email||!pwd){showLoginErr('Remplis les deux champs.');return;}
  const btn=$('loginBtn');btn.disabled=true;btn.textContent='Connexion…';
  try{const{data,error}=await sb.auth.signInWithPassword({email,password:pwd});if(error)throw error;me=data.user;await loadProfile();}
  catch(e){showLoginErr(e.message||'Erreur de connexion');}
  finally{btn.disabled=false;btn.textContent='Entrer';}
}

async function loadProfile(){
  const{data:p,error}=await sb.from('profiles').select('*').eq('id',me.id).single();
  if(error||!p){showLoginErr('Profil introuvable.');await sb.auth.signOut();me=null;showLogin(true);return;}
  myProfile=p;showLogin(false);updateNav();await renderView('sessions');
}

function updateNav(){
  $('userAvatar').textContent=initials(myProfile?.nom,myProfile?.prenom)||'?';
  $('userName').textContent=myProfile?.prenom||me?.email?.split('@')[0]||'';
  $('userPill').title=myProfile?.role==='directeur'?'Vue directeur':'Vue commercial';
}

$('loginBtn').addEventListener('click',handleLogin);
$('passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin();});
$('userPill').addEventListener('click',async()=>{if(confirm('Déconnexion ?')){await sb.auth.signOut();me=null;myProfile=null;showLogin(true);}});

document.querySelectorAll('.nav-tab').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderView(btn.dataset.view);
}));
$('launchBtn').addEventListener('click',openDrawer);

async function renderView(view){currentView=view;if(view==='sessions')await renderSessions();else if(view==='ranking')await renderRanking();}

async function renderSessions(){
  const c=$('mainContent');c.innerHTML='<div style="padding:40px;text-align:center;color:var(--t3)">Chargement…</div>';
  let q=sb.from('simulations').select('id,user_id,created_at,duree_secondes,type_scenario,statut,type_entretien,phase_choisie,b2b_b2c,url_audio,bilans(note_globale),profiles(nom,prenom)').order('created_at',{ascending:false});
  if(myProfile?.role==='commercial')q=q.eq('user_id',me.id);
  const{data:sims,error}=await q;
  if(error){c.innerHTML=`<div style="padding:40px;text-align:center;color:var(--red)">${esc(error.message)}</div>`;return;}
  if(!sims?.length){
    c.innerHTML=`<div class="hero-empty">
      <div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></div>
      <div class="hero-title">Première simulation</div>
      <p class="hero-sub">Lance ta première session pour commencer à mesurer tes performances commerciales.</p>
      <button class="btn-launch" onclick="openDrawer()" style="margin-top:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        C'est parti
      </button>
    </div>`;
    return;
  }
  let h=`<div class="journal-header"><h2 class="journal-title">Tes sessions</h2><span class="journal-count">${sims.length}</span></div><div class="journal" style="margin-top:16px">`;
  sims.forEach(s=>{
    const note=s.bilans?.[0]?.note_globale;
    const nc=note!=null?ncls(note):'none';
    const nd=note!=null?`${note}/100`:'—';
    const dirLabel=myProfile?.role==='directeur'&&s.profiles?` <span style="font-weight:400;color:var(--t3)">— ${esc(s.profiles.prenom||'')} ${esc(s.profiles.nom||'')}</span>`:'';
    h+=`<div class="session-row" data-id="${esc(s.id)}">
      <div class="session-stripe ${nc}"></div>
      <div class="session-info">
        <div class="session-name">${esc(simLabel(s))}${dirLabel}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
          <span class="session-date">${fmtDate(s.created_at)}</span>
          <span class="session-status ${s.statut||''}">${esc(s.statut||'—')}</span>
        </div>
      </div>
      <span class="session-dur">${fmtDur(s.duree_secondes||0)}</span>
      <span class="session-score ${nc}">${esc(nd)}</span>
    </div>`;
  });
  h+='</div>';
  c.innerHTML=h;
  c.querySelectorAll('.session-row').forEach(r=>r.addEventListener('click',()=>openDebrief(r.dataset.id)));
  const target=new URLSearchParams(location.search).get('simulationId');
  const cand=target?sims.find(s=>String(s.id)===String(target)):null;
  if(cand&&cand.id!==latestAutoOpen){latestAutoOpen=cand.id;if(target)history.replaceState({},document.title,location.pathname);setTimeout(()=>openDebrief(cand.id),200);}
}

function scDisc(tr){let q=0,ph='disc';for(const t of tr||[]){const tx=String(t.texte||'').toLowerCase();if(/(signature|contrat|on signe|on bloque)/.test(tx))ph='close';else if(/(trop cher|pas le temps|pas interest)/.test(tx))ph='obj';else if(/(demo|notre solution|comment.a marche)/.test(tx))ph='pitch';if(t.locuteur==='commercial'&&ph==='disc')q+=(tx.match(/\?/g)||[]).length;}return Math.min(100,q*15);}

function buildRadar(met,tr){
  const fallback=[
    Math.min(100,Number(met?.ratio_questions_affirmations)||0),
    Math.min(100,Number(met?.taux_resolution_objections)||0),
    scDisc(tr),
    Number(met?.nb_signaux_achat)>0?Math.max(0,Math.min(100,100-(Number(met?.delai_moyen_closing_apres_signal)||0)/60*100)):0,
    Math.max(0,Math.min(100,100-((Number(met?.nb_interruptions)||0)*10+(Number(met?.nb_silences_remplis)||0)*5))),
    Math.min(100,Math.max(0,Number(met?.score_engagement_final)||0))
  ];
  const useQuali=['radar_questions','radar_objections','radar_decouverte','radar_closing','radar_rythme','radar_pratiques'].some(k=>met?.[k]!=null);
  if(!useQuali)return fallback;
  const quali=[met.radar_questions,met.radar_objections,met.radar_decouverte,met.radar_closing,met.radar_rythme,met.radar_pratiques];
  return fallback.map((v,i)=>{
    if(quali[i]==null)return v;
    return Math.round((v+Number(quali[i]))/2);
  });
}

async function avgRadar(simId){
  const{data:ss}=await sb.from('simulations').select('id').eq('user_id',me.id).eq('statut','terminee');
  const ids=(ss||[]).map(s=>s.id).filter(id=>id!==simId);
  if(!ids.length)return null;
  const{data:mets}=await sb.from('metriques').select('*').in('simulation_id',ids);
  if(!mets?.length)return null;
  const sum=[0,0,0,0,0,0];
  mets.forEach(m=>{
    const d=Number(m.delai_moyen_closing_apres_signal)||0;
    const cl=Number(m.nb_signaux_achat)>0?Math.max(0,Math.min(100,100-(d/60)*100)):0;
    const ry=Math.max(0,Math.min(100,100-((Number(m.nb_interruptions)||0)*10+(Number(m.nb_silences_remplis)||0)*5)));
    const base=[Number(m.ratio_questions_affirmations)||0,Number(m.taux_resolution_objections)||0,Math.min(100,(Number(m.nb_questions_qualification)||0)*15),cl,ry,Number(m.score_engagement_final)||0];
    const quali=[m.radar_questions,m.radar_objections,m.radar_decouverte,m.radar_closing,m.radar_rythme,m.radar_pratiques];
    base.forEach((v,i)=>{
      let val=v;
      if(quali[i]!=null)val=Math.round((v+Number(quali[i]))/2);
      sum[i]+=val;
    });
  });
  return sum.map(v=>Math.round(v/mets.length));
}

function radarSVG(cur,avg){
  const lb=['Questions','Objections','Découverte','Closing','Rythme','Pratiques'],cx=50,cy=50,r=34;
  const pts=vs=>vs.map((v,i)=>{const a=-Math.PI/2+i*(Math.PI*2/lb.length),rv=r*(Math.max(0,Math.min(100,v))/100);return`${cx+Math.cos(a)*rv},${cy+Math.sin(a)*rv}`;}).join(' ');
  const grid=[25,50,75,100].map(l=>`<polygon points="${pts(lb.map(()=>l))}" fill="none" stroke="var(--border)" stroke-width="0.4"/>`).join('');
  const axes=lb.map((l,i)=>{const a=-Math.PI/2+i*(Math.PI*2/lb.length),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r,lx=cx+Math.cos(a)*43,ly=cy+Math.sin(a)*43;return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border)" stroke-width="0.35"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="3.8" fill="var(--t3)">${esc(l)}</text>`;}).join('');
  const av=avg?`<polygon points="${pts(avg)}" fill="rgba(167,139,250,.06)" stroke="rgba(167,139,250,.5)" stroke-width="0.9" stroke-dasharray="2 1.5"/>`:'';
  return`<svg class="radar-svg" viewBox="0 0 100 100"><g>${grid}${axes}${av}<polygon points="${pts(cur)}" fill="var(--accentBg)" stroke="var(--accent)" stroke-width="1.3"/></g></svg>`;
}

function resetWS(){Object.assign(ws,{step:1,sessionId:null,b2b_b2c:null,mode:null,v_type:'',v_product:'',v_url:'',p_role:'',p_type:'',p_url:'',p_profile:'',interview:null,phase:null,prev_id:null,cont:null,contMode:null,intensite:3,savedPersonaId:null,savedVendeurId:null});}

async function loadSavedPersonas(){
  try{const r=await apiCall('/api/personas/list');if(!r.ok)return;const d=await r.json();ws.savedPersonas=d.personas||[];}catch(_){ws.savedPersonas=[];}

async function loadSavedVendeurs(){
  try{const r=await apiCall('/api/vendeurs/list');if(!r.ok)return;const d=await r.json();ws.savedVendeurs=d.vendeurs||[];}catch(_){ws.savedVendeurs=[];}

async function openDrawer(){
  resetWS();
  await Promise.all([loadSavedPersonas(),loadSavedVendeurs()]);
  let q=sb.from('simulations').select('id,created_at,type_entretien,phase_choisie,type_scenario,b2b_b2c,statut').eq('statut','terminee').order('created_at',{ascending:false}).limit(30);

function closeDrawer(){$('drawerOverlay').classList.remove('open');}
$('drawerClose').addEventListener('click',closeDrawer);
$('drawerOverlay').addEventListener('click',e=>{if(e.target===$('drawerOverlay'))closeDrawer();});

function renderDrawer(){
  const stepLabels={
    1:'B2B ou B2C',
    2:'Nouveau ou suite',
    3:'Configuration',
    4:'Entretien'
  };
  const pct=Math.round((ws.step/4)*100);
  $('drawerBar').style.width=`${pct}%`;
  $('drawerStepLabel').textContent=`Étape ${ws.step} sur 4 · ${stepLabels[ws.step]||''}`;
  $('drawerPrev').style.display=ws.step>1?'':'none';
  const showNextBtn = ws.step===3;
  $('drawerNext').style.display = showNextBtn ? '' : 'none';
  $('drawerNext').textContent='Continuer';
  $('drawerNext').onclick=drawerNext;
  $('drawerPrev').onclick=drawerBack;
  $('drawerBody').innerHTML=renderDrawerStep();
  bindDrawerEvents();
}

function bindDrawerEvents(){
  const slider=$('intensiteSlider');
  if(slider){
    slider.addEventListener('input',()=>{
      ws.intensite=Number(slider.value);
      const disp=$('intensiteDisplay');const desc=$('intensiteDesc');
      if(disp)disp.textContent=`${ws.intensite}/5`;
      if(desc)desc.textContent=INTENSITE_DESCS[ws.intensite];
    });
  }
  const selP=$('savedPersonaSelect');
  if(selP){
    selP.addEventListener('change',()=>{
      ws.savedPersonaId=selP.value||null;
      const info=$('savedPersonaInfo');
      if(info)info.classList.toggle('show',!!ws.savedPersonaId);
      if(ws.savedPersonaId){
        const p=ws.savedPersonas.find(x=>x.id===ws.savedPersonaId);
        if(p){
          ws.intensite=p.intensite||3;
          const sl=$('intensiteSlider');if(sl)sl.value=ws.intensite;
          const disp=$('intensiteDisplay');if(disp)disp.textContent=`${ws.intensite}/5`;
          const desc=$('intensiteDesc');if(desc)desc.textContent=INTENSITE_DESCS[ws.intensite];
        }
      }
    });
  }
  const btnVarP=$('btnAutreVariation');
  if(btnVarP){
    btnVarP.addEventListener('click',()=>{
      ws.savedPersonaId=null;
      const sel=$('savedPersonaSelect');if(sel)sel.value='';
      const info=$('savedPersonaInfo');if(info)info.classList.remove('show');
    });
  }
  const selV=$('savedVendeurSelect');
  if(selV){
    selV.addEventListener('change',()=>{
      ws.savedVendeurId=selV.value||null;
      if(ws.savedVendeurId){
        const v=ws.savedVendeurs.find(x=>x.id===ws.savedVendeurId);
        if(v){
          ws.v_type=v.type_entreprise||'';
          ws.v_product=v.produit_service||'';
          ws.v_url=v.url||'';
          const it=$('v-type');const ip=$('v-product');const iu=$('v-url');
          if(it)it.value=ws.v_type;
          if(ip)ip.value=ws.v_product;
          if(iu)iu.value=ws.v_url;
        }
      }
    });
  }
}

function pickB2B2C(v){
  ws.b2b_b2c=v;
  Object.assign(ws,{p_role:'',p_type:'',p_url:'',p_profile:''});
  ws.step=2;

}

function pickMode(m){
  ws.mode=m;
  ws.contMode = m==='continue' ? 'continue' : 'new';
  if(m==='new'){
    ws.prev_id=null;ws.cont=null;
    ws.step=3;
  }else{
    ws.prev_id=null;ws.cont=null;
    ws.step=3;
  }
  renderDrawer();
}

function pickInterviewType(t){
  ws.interview=t;
  if(t==='cold_call'){ws.phase=null;}
  ws.prev_id = ws.contMode==='continue' ? ws.prev_id : null;
  ws.cont = ws.contMode==='continue' ? ws.cont : null;
  renderDrawer();
}
function pickRdvPhase(v){
  ws.phase=v;
  renderDrawer();
}

function renderDrawerStep(){
  // ─── Étape 1 : B2B/B2C ───
  if(ws.step===1)return`
    <div class="step-title">Quel type de vente ?</div>
    <div class="step-sub">Le scénario et la psychologie du prospect s'adaptent à ton contexte.</div>
    <div class="pick-grid">
      <button class="pick-card ${ws.b2b_b2c==='b2b'?'sel':''}" onclick="pickB2B2C('b2b')">
        <div class="pick-label">B2B</div>
        <div class="pick-desc">Tu vends à une entreprise. Le prospect a un rôle, des enjeux organisationnels, un budget.</div>
      </button>
      <button class="pick-card ${ws.b2b_b2c==='b2c'?'sel':''}" onclick="pickB2B2C('b2c')">
        <div class="pick-label">B2C</div>
        <div class="pick-desc">Tu vends à un consommateur. Décision plus émotionnelle, cycle court.</div>
      </button>
    </div>
    <div id="w-err" class="w-error"></div>`;

  // ─── Étape 2 : Nouveau / Continuer ───
  if(ws.step===2)return`
    <div class="step-title">Nouveau scénario ou suite ?</div>
    <div class="step-sub">Un nouveau scénario crée un prospect inédit. Une suite conserve le même prospect et sa mémoire.</div>
    <div class="pick-grid">
      <button class="pick-card ${ws.mode==='new'?'sel':''}" onclick="pickMode('new')">
        <div class="pick-label">Nouveau scénario</div>
        <div class="pick-desc">Tu crées un nouveau prospect à partir de zéro.</div>
      </button>
      <button class="pick-card ${ws.mode==='continue'?'sel':''}" onclick="pickMode('continue')">
        <div class="pick-label">Continuer une simulation</div>
        <div class="pick-desc">Reprends le même prospect après un Cold Call ou un RDV.</div>
      </button>
    </div>
    <div id="w-err" class="w-error"></div>`;

  // ─── Étape 3 ───
  if(ws.mode==='continue') return renderContinueStep();
  return renderNewScenarioStep();
}

// ─── Étape 3a : Nouveau scénario ───
function renderNewScenarioStep(){
  const b2b=ws.b2b_b2c==='b2b';
  let h=`
    <div class="step-title">Toi et ton prospect</div>
    <div class="step-sub">Plus tu es précis, plus le scénario sera réaliste.</div>`;

  // Sélection vendeur sauvegardé
  if(ws.savedVendeurs.length){
    h+=`
    <div class="section-sep">Utiliser un vendeur sauvegardé</div>
    <div class="field-block">
      <select class="d-select" id="savedVendeurSelect">
        <option value="">— Saisir manuellement —</option>
        ${ws.savedVendeurs.map(v=>`<option value="${esc(v.id)}" ${ws.savedVendeurId===v.id?'selected':''}>${esc(v.nom)}${v.type_entreprise?` · ${esc(v.type_entreprise)}`:''}</option>`).join('')}
      </select>
    </div>`;
  }

  h+=`<div class="section-sep">Ce que tu vends</div>
    <div class="field-row-2">
      <div class="field-block"><label class="d-label">Ton type d'entreprise</label><input class="d-input" id="v-type" value="${esc(ws.v_type)}" oninput="ws.v_type=this.value" placeholder="Ex : SaaS RH, Cabinet conseil…"></div>
      <div class="field-block"><label class="d-label">Produit ou service</label><input class="d-input" id="v-product" value="${esc(ws.v_product)}" oninput="ws.v_product=this.value" placeholder="Ex : Logiciel de formation…"></div>
    </div>
    <div class="field-block">
      <label class="d-label">URL de ton site — facultatif</label>
      <div class="url-pair"><input class="d-input" id="v-url" value="${esc(ws.v_url)}" oninput="ws.v_url=this.value" placeholder="https://…"><button class="btn-analyze" onclick="analyzeUrl('v')">Analyser</button></div>
      <div class="analyze-result" id="v-res"></div>
    </div>
    <button class="btn-small" onclick="saveCurrentVendeur()">💾 Sauvegarder ces infos vendeur</button>

    <div class="section-sep">Ton prospect</div>`;

  // Sélection persona sauvegardé
  if(ws.savedPersonas.length){
    h+=`<div class="field-block">
      <label class="d-label">Utiliser un persona sauvegardé</label>
      <select class="d-select" id="savedPersonaSelect">
        <option value="">— Créer un nouveau persona —</option>
        ${ws.savedPersonas.map(p=>`<option value="${esc(p.id)}" ${ws.savedPersonaId===p.id?'selected':''}>${esc(p.nom_persona)} (${esc(p.archetype)}, ${p.intensite}/5)</option>`).join('')}
      </select>
      <div class="saved-info ${ws.savedPersonaId?'show':''}" id="savedPersonaInfo">✅ Persona existant utilisé. L'archétype est conservé, l'intensité est modifiable.</div>
      <button class="btn-small" id="btnAutreVariation" type="button">🔄 Retirer la sélection</button>
    </div>`;
  }

  h+= b2b?`
    <div class="field-row-2">
      <div class="field-block"><label class="d-label">Rôle</label><select class="d-select" onchange="ws.p_role=this.value"><option value="">Choisir…</option>${[['drh','DRH'],['dirco','Directeur Commercial'],['ceo','CEO / Président'],['coo','Directeur des Opérations'],['daf','DAF'],['ops','Resp. Opérations'],['autre','Autre']].map(([v,l])=>`<option value="${v}" ${ws.p_role===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field-block"><label class="d-label">Secteur ou type d'entreprise</label><input class="d-input" value="${esc(ws.p_type)}" oninput="ws.p_type=this.value" placeholder="Ex : PME industrielle…"></div>
    </div>
    <div class="field-block">
      <label class="d-label">URL de son entreprise — facultatif</label>
      <div class="url-pair"><input class="d-input" id="p-url" value="${esc(ws.p_url)}" oninput="ws.p_url=this.value" placeholder="https://…"><button class="btn-analyze" onclick="analyzeUrl('p')">Analyser</button></div>
      <div class="analyze-result" id="p-res"></div>
    </div>`:`
    <div class="field-block"><label class="d-label">Profil du prospect</label><textarea class="d-textarea" oninput="ws.p_profile=this.value" placeholder="Age, situation, ce qu'il cherche, ses freins éventuels…">${esc(ws.p_profile)}</textarea></div>`;

  // Curseur intensité
  h+=`<div class="section-sep">Intensité du prospect</div>
    <div class="intensite-block">
      <div class="intensite-header">
        <span class="intensite-label">Difficulté</span>
        <span class="intensite-value" id="intensiteDisplay">${ws.intensite}/5</span>
      </div>
      <input type="range" min="1" max="5" value="${ws.intensite}" class="intensite-slider" id="intensiteSlider">
      <div class="intensite-scale"><span>1 · Facile</span><span>3 · Neutre</span><span>5 · Difficile</span></div>
      <div class="intensite-desc" id="intensiteDesc">${INTENSITE_DESCS[ws.intensite]}</div>
    </div>
    <div id="w-err" class="w-error"></div>`;
  return h;
}

// ─── Étape 3b : Continuer ───
function renderContinueStep(){
  // On sait qu'on continue. On ne choisit PAS le type d'entretien ici (sera RDV).
  // L'utilisateur sélectionne la sim précédente compatible.
  // La phase (complet, decouverte) détermine la cible.

  const compat = ws.prevSims.filter(s => isCompatAny(s));
  let h=`
    <div class="step-title">Continuer une simulation</div>
    <div class="step-sub">Choisis la simulation précédente. La suite se fera en rendez-vous (le prospect garde la mémoire).</div>`;

  if(!compat.length){
    h+='<div style="padding:20px;text-align:center;font-size:13px;color:var(--t3);background:var(--surf2);border-radius:8px">Aucune simulation précédente compatible.</div>';
  } else {
    h+=`<div class="prev-list">`;
    compat.forEach(s=>{
      const sel=ws.prev_id===s.id;
      h+=`<div class="prev-item ${sel?'sel':''}" onclick="selectPrevSim('${esc(s.id)}')">
        <div class="prev-item-name">${esc(simLabel(s))}</div>
        <div class="prev-item-meta">${fmtDate(s.created_at)} · ${s.b2b_b2c?s.b2b_b2c.toUpperCase():''}</div>
      </div>`;
    });
    h+='</div>';
  }

  // Si sim sélectionnée et c'est un RDV → choix de la phase suivante
  if(ws.prev_id){
    const s=ws.prevSims.find(x=>x.id===ws.prev_id);
    if(s){
      if(s.type_entretien==='cold_call'){
        // Cold Call continué → force RDV + phase decouverte ou complet
        h+=`<div class="section-sep">Phase cible</div>
        <div class="field-block">
          <select class="d-select" onchange="pickPhaseForContinue(this.value)">
            <option value="">Choisir…</option>
            <option value="decouverte" ${ws.phase==='decouverte'?'selected':''}>Découverte</option>
            <option value="complet" ${ws.phase==='complet'?'selected':''}>Entretien complet</option>
          </select>
          <div style="margin-top:8px;font-size:11px;color:var(--t3);font-style:italic">Ce Cold Call sera transformé en rendez-vous (le prospect se souviendra de vous).</div>
        </div>`;
      } else {
        // RDV → auto meme_rdv, choix de la phase suivante
        const availablePhases = getNextPhasesFor(s);
        h+=`<div class="section-sep">Phase cible</div>
        <div class="field-block">
          <select class="d-select" onchange="pickPhaseForContinue(this.value)">
            <option value="">Choisir…</option>
            ${availablePhases.map(([v,l])=>`<option value="${v}" ${ws.phase===v?'selected':''}>${l}</option>`).join('')}
          </select>
          <div style="margin-top:8px;font-size:11px;color:var(--t3);font-style:italic">Suite du même rendez-vous (le prospect garde la mémoire).</div>
        </div>`;
      }
    }
  }

  h+='<div id="w-err" class="w-error"></div>';
  return h;
}

function selectPrevSim(id){
  ws.prev_id=id;
  const s=ws.prevSims.find(x=>x.id===id);
  if(s){
    if(s.type_entretien==='cold_call'){
      ws.cont='nouveau_rdv';
      ws.phase=ws.phase||'decouverte';
    } else {
      ws.cont='meme_rdv';
      ws.phase=null;
    }
    ws.interview='rdv';
  }
  renderDrawer();
}

function pickPhaseForContinue(v){
  ws.phase=v;
  renderDrawer();
}

function isCompatAny(s){
  if(s.b2b_b2c && s.b2b_b2c !== ws.b2b_b2c) return false;
  if(s.type_entretien==='cold_call') return true; // cold call → peut continuer vers rdv decouverte/complet
  if(s.type_entretien==='rdv'){
    return ['decouverte','demo','objections_closing','nego','complet'].includes(s.phase_choisie);
  }
  return false;
}

function getNextPhasesFor(s){
  if(s.type_entretien==='cold_call'){
    return [['decouverte','Découverte'],['complet','Entretien complet']];
  }
  const p=s.phase_choisie;
  if(p==='complet') return [['decouverte','Découverte'],['demo','Démo'],['objections_closing','Objections & Closing'],['nego','Négociation']];
  if(p==='decouverte') return [['demo','Démo'],['objections_closing','Objections & Closing']];
  if(p==='demo') return [['objections_closing','Objections & Closing'],['nego','Négociation']];
  if(p==='objections_closing') return [['nego','Négociation']];
  return [];
}

// ─── Étape 4 : Type d'entretien ───
function renderInterviewStep(){
  // Seul cas où on arrive ici : nouveau scénario (mode='new')
  const isColdCall=ws.interview==='cold_call';
  const isRdv=ws.interview==='rdv';
  const canCreate = isColdCall || (isRdv && ws.phase);

  let h=`
    <div class="step-title">Type d'entretien</div>
    <div class="step-sub">Le Cold Call part de zéro. Le RDV donne au prospect le contexte du rendez-vous.</div>
    <div class="pick-grid">
      <button class="pick-card ${isColdCall?'sel':''}" onclick="pickInterviewType('cold_call')">
        <div class="pick-label">Cold Call</div>
        <div class="pick-desc">Le prospect découvre tout au fil de la conversation. Prise de contact à froid.</div>
      </button>
      <button class="pick-card ${isRdv?'sel':''}" onclick="pickInterviewType('rdv')">
        <div class="pick-label">Rendez-vous</div>
        <div class="pick-desc">Le prospect sait pourquoi vous vous parlez. Il attend une démonstration ou une discussion.</div>
      </button>
    </div>`;

  if(isRdv){
    h+=`<div class="field-block" style="margin-top:16px">
      <label class="d-label">Phase à travailler</label>
      <select class="d-select" onchange="pickRdvPhase(this.value)">
        <option value="">Choisir…</option>
        ${[['complet','Entretien complet'],['decouverte','Découverte'],['demo','Démo produit'],['objections_closing','Objections & Closing'],['nego','Négociation']].map(([v,l])=>`<option value="${v}" ${ws.phase===v?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>`;
  }

  h+=`<div class="final-create-block ${canCreate?'show':''}">
    <button class="btn-create" id="btnCreateFinal" onclick="createSim()">Créer la simulation</button>
  </div>
  <div id="w-err" class="w-error"></div>`;
  return h;
}

// Le rendu de l'étape 4 doit être dynamique : si c'est un nouveau scénario, on va à l'étape 4.
// Petite surcharge de renderDrawerStep : si step===4, appeler renderInterviewStep.

const _renderDrawerStep = renderDrawerStep;
renderDrawerStep = function(){
  if(ws.step===4) return renderInterviewStep();
  return _renderDrawerStep();
};

// ─── Navigation ───
function drawerNext(){
  const err=$('w-err');if(err)err.classList.remove('show');

  if(ws.step===1){ if(!ws.b2b_b2c){showErr('Choisis B2B ou B2C.');return;} ws.step=2; renderDrawer(); return; }
  if(ws.step===2){ if(!ws.mode){showErr('Choisis Nouveau ou Continuer.');return;} ws.step=3; renderDrawer(); return; }
  if(ws.step===3){
    if(ws.mode==='new'){
      if(!validateNewScenario())return;
      ws.interview=null;ws.phase=null;
      ws.step=4;
      prewarm();
      renderDrawer();
      return;
    } else {
      if(!validateContinue())return;
      // En continue, on va directement créer (pas d'étape 4, on a déjà déterminé interview/phase)
      ws.step=4;
      renderDrawer();
      return;
    }
  }
}

function drawerBack(){
  const err=$('w-err');if(err)err.classList.remove('show');
  if(ws.step>1){ws.step--;if(ws.step===3&&ws.mode==='new'){/* rien */}renderDrawer();}
}

function showErr(msg){const e=$('w-err');if(e){e.textContent=msg;e.classList.add('show');}}

function validateNewScenario(){
  if(!ws.v_type.trim() && !ws.v_url.trim()){showErr("Renseigne ton type d'entreprise ou fournis une URL.");return false;}
  if(!ws.v_product.trim() && !ws.v_url.trim()){showErr('Renseigne ton produit / service.');return false;}
  if(ws.b2b_b2c==='b2b'){
    if(!ws.p_role){showErr('Choisis le rôle du prospect.');return false;}
    if(!ws.p_type.trim() && !ws.p_url.trim()){showErr("Renseigne le secteur du prospect ou fournis une URL.");return false;}
  } else {
    if(!ws.p_profile.trim()){showErr('Décris le profil du prospect B2C.');return false;}
  }
  return true;
}

function validateContinue(){
  if(!ws.prev_id){showErr('Choisis une simulation précédente.');return false;}
  if(!ws.phase){showErr('Choisis une phase cible.');return false;}
  return true;
}

async function saveCurrentVendeur(){
  const nom=prompt('Nom de ce vendeur (pour le retrouver plus tard) :','');
  if(nom===null)return;
  if(!nom.trim()){alert('Nom requis.');return;}
  try{
    const r=await apiCall('/api/vendeurs/save',{method:'POST',body:JSON.stringify({
      nom:nom.trim(),
      type_entreprise:ws.v_type.trim()||null,
      produit_service:ws.v_product.trim()||null,
      url:ws.v_url.trim()||null
    })});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Erreur');
    alert('✅ Vendeur sauvegardé.');
    await loadSavedVendeurs();
    renderDrawer();
  }catch(e){alert(`Erreur : ${e.message}`);}
}

async function analyzeUrl(tgt){
  const url=tgt==='v'?ws.v_url:ws.p_url;
  if(!url.trim())return;
  const inputId=tgt==='v'?'v-url':'p-url',resId=tgt==='v'?'v-res':'p-res';
  const btn=document.querySelector(`#${inputId}+.btn-analyze`);
  if(btn){btn.disabled=true;btn.textContent='Analyse…';}
  try{
    const r=await apiCall('/api/analyze-url',{method:'POST',body:JSON.stringify({url:url.trim(),cible:tgt==='v'?'vendeur':'prospect',b2b_b2c:ws.b2b_b2c,prospect_role:ws.p_role})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Impossible');
    if(tgt==='v'){if(!ws.v_type&&d.type_entreprise)ws.v_type=d.type_entreprise;if(!ws.v_product&&d.produit_service)ws.v_product=d.produit_service;}
    else{if(!ws.p_type&&d.type_entreprise_prospect)ws.p_type=d.type_entreprise_prospect;}
    renderDrawer();
    const res=$(resId);if(res){res.textContent='Analyse terminée — vérifie et corrige.';res.classList.add('show');}
  }catch(e){alert(`Erreur : ${e.message}`);}
  finally{if(btn){btn.disabled=false;btn.textContent='Analyser';}}
}

function prewarm(){
  if(ws.prev_id)return;
  if(!ws.sessionId)ws.sessionId=(crypto.randomUUID&&crypto.randomUUID())||`s_${Date.now()}_${Math.random().toString(36).slice(2)}`;
  apiCall('/api/simulation/prewarm',{
    method:'POST',
    body:JSON.stringify({
      sessionId:ws.sessionId,
      b2b_b2c:ws.b2b_b2c,
      vendeur_type_entreprise:ws.v_type.trim(),
      vendeur_produit:ws.v_product.trim(),
      vendeur_url:ws.v_url.trim()||null,
      prospect_role:ws.b2b_b2c==='b2b'?ws.p_role:null,
      prospect_type_entreprise:ws.b2b_b2c==='b2b'?ws.p_type.trim():null,
      prospect_url:ws.b2b_b2c==='b2b'?(ws.p_url.trim()||null):null,
      prospect_profile:ws.b2b_b2c==='b2c'?ws.p_profile.trim():null,
      type_entretien:ws.interview,
      phase_choisie:ws.interview==='rdv'?ws.phase:null,
      intensite: ws.intensite,
      savedPersonaId: ws.savedPersonaId || null
    })
  }).catch(()=>{});
}

async function waitForPersona(simulationId){
  const maxAttempts=90;
  for(let i=0;i<maxAttempts;i++){
    await new Promise(r=>setTimeout(r,1000));
    try{
      const r=await apiCall(`/api/simulation/context?simulationId=${encodeURIComponent(simulationId)}`);
      if(r.status===202)continue;
      if(r.status===500){
        const d=await r.json().catch(()=>({}));
        throw new Error(d.error||'La préparation du scénario a échoué.');
      }
      if(!r.ok)return false;
      const d=await r.json();
      if(d.ready)return true;
    }catch(e){
      if(e.message && e.message.includes('échoué'))throw e;
    }
  }
  return false;
}

async function createSim(){
  const err=$('w-err');if(err)err.classList.remove('show');

  if(ws.mode==='new'){
    if(!ws.interview){showErr('Choisis Cold Call ou RDV.');return;}
    if(ws.interview==='rdv'&&!ws.phase){showErr('Choisis une phase.');return;}
  } else {
    if(!ws.prev_id||!ws.phase){showErr('Configuration incomplète.');return;}
  }

  const btn=$('btnCreateFinal')||$('drawerNext');
  if(btn){btn.disabled=true;btn.textContent='Création…';}

  try{
    const isContinue = ws.mode==='continue';
    const payload={
      sessionId: !isContinue ? (ws.sessionId||null) : null,
      intensite: ws.intensite,
      savedPersonaId: !isContinue ? (ws.savedPersonaId||null) : null,
      b2b_b2c: ws.b2b_b2c,
      vendeur_type_entreprise: !isContinue ? ws.v_type.trim() : null,
      vendeur_produit: !isContinue ? ws.v_product.trim() : null,
      vendeur_url: !isContinue ? (ws.v_url.trim()||null) : null,
      prospect_role: !isContinue && ws.b2b_b2c==='b2b' ? ws.p_role : null,
      prospect_type_entreprise: !isContinue && ws.b2b_b2c==='b2b' ? ws.p_type.trim() : null,
      prospect_url: !isContinue && ws.b2b_b2c==='b2b' ? (ws.p_url.trim()||null) : null,
      prospect_profile: !isContinue && ws.b2b_b2c==='b2c' ? ws.p_profile.trim() : null,
      type_entretien: isContinue ? 'rdv' : ws.interview,
      phase_choisie: isContinue ? ws.phase : (ws.interview==='rdv'?ws.phase:null),
      simulation_precedente_id: isContinue ? ws.prev_id : null,
      continuite_rdv: isContinue ? ws.cont : null
    };

    const {data:{session}}=await sb.auth.getSession();
    if(!session?.access_token||!session?.refresh_token)throw new Error('Session expirée.');
    const hR=await fetch(`${SIM_URL}/api/auth/handshake`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({refresh_token:session.refresh_token})});
    if(!hR.ok)throw new Error('Connexion au serveur impossible.');
    const{code}=await hR.json();

    const r=await apiCall('/api/simulation/start',{method:'POST',body:JSON.stringify(payload)});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Erreur création');

    if(d.status==='preparation'){
      if(btn)btn.textContent='Préparation du scénario…';
      const ready=await waitForPersona(d.simulationId);
      if(!ready)throw new Error('La préparation du scénario a échoué.');
    }

    closeDrawer();
    window.location.href=`${SIM_URL}/?code=${encodeURIComponent(code)}&simulationId=${encodeURIComponent(d.simulationId)}`;
  }catch(e){
    if(err){err.textContent=e.message;err.classList.add('show');}
    if(btn){btn.disabled=false;btn.textContent='Créer la simulation';}
  }
}

(async()=>{
  try{const{data:{session},error}=await sb.auth.getSession();if(error)console.error(error);if(session){me=session.user;await loadProfile();}else showLogin(true);}
  catch(e){console.error(e);showLogin(true);}
})();
</script>
